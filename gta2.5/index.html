<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>GTA 2.5: Concrete Heights</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  html,body{margin:0;padding:0;overflow:hidden;background:#000;}
  canvas{display:block;}
</style>
<style>
#jsui{position:fixed;inset:0;z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:"Arial Black",Impact,system-ui,sans-serif;color:#fff;background:radial-gradient(ellipse at center,rgba(0,0,0,.35),rgba(0,0,0,.85))}
#jsui .pn{display:flex;flex-direction:column;gap:10px;align-items:stretch;min-width:min(340px,86vw);max-width:min(560px,92vw);max-height:80vh;overflow:auto;padding:26px 30px;text-align:center}
#jsui h1{font-size:clamp(52px,12vw,104px);margin:0;color:#ffcc00;letter-spacing:.04em;text-shadow:4px 4px 0 #b33,0 0 40px rgba(255,204,0,.45);font-style:italic}
#jsui h2{margin:0 0 10px;font-size:clamp(14px,3vw,20px);letter-spacing:.5em;color:#ddd}
#jsui button,#jsui select{font:inherit;font-size:16px;padding:11px 18px;background:rgba(20,20,20,.85);color:#fff;border:2px solid #555;border-radius:4px;cursor:pointer;letter-spacing:.06em}
#jsui button:hover{background:#ffcc00;color:#000;border-color:#ffcc00}
#jsui label{display:flex;justify-content:space-between;align-items:center;gap:14px;font-size:14px;text-align:left;font-family:monospace;color:#ccc}

#jsui p{font-family:Georgia,serif;font-size:clamp(17px,2.6vw,22px);line-height:1.6;color:#eee;margin:8px 0 18px;font-weight:400;text-align:left}
#jsui .ft{position:absolute;bottom:12px;font:12px monospace;color:#999;letter-spacing:.1em}
#jsui .sm{font:13px/1.8 monospace;color:#bbb;text-align:left}
#jsui .pn.opn{padding:0;gap:0;width:min(780px,94vw);max-width:94vw;max-height:88vh;overflow:hidden;text-align:left;background:linear-gradient(180deg,rgba(26,26,30,.97),rgba(12,12,14,.97));border:1px solid rgba(255,204,0,.28);border-radius:12px;box-shadow:0 24px 80px rgba(0,0,0,.75)}
.opn .oh{padding:18px 24px 0;border-bottom:1px solid rgba(255,255,255,.08)}
#jsui .opn h2{margin:0 0 10px;letter-spacing:.4em;color:#ffcc00;font-size:14px}
.opn .tabs{display:flex;gap:2px;flex-wrap:wrap}
#jsui .opn .tabs button{background:none;border:0;border-bottom:3px solid transparent;border-radius:0;padding:10px 16px;font:700 12px system-ui,sans-serif;color:#8d8d94;letter-spacing:.2em}
#jsui .opn .tabs button:hover{background:none;color:#fff}
#jsui .opn .tabs button.on{color:#ffcc00;border-bottom-color:#ffcc00}
.opn .ob{padding:18px 24px;overflow:auto;display:flex;flex-direction:column;gap:16px;flex:1 1 auto;min-height:0}

#jsui .opn .of button{font:700 13px system-ui,sans-serif;letter-spacing:.12em;padding:10px 22px;border-radius:6px;background:#1c1c20;border:1px solid #44444b}
#jsui .opn .of button:hover{background:#ffcc00;color:#000;border-color:#ffcc00}
.opn .row{display:flex;align-items:center;justify-content:space-between;gap:12px 18px;flex-wrap:wrap}
.opn .lb{font:600 14px system-ui,sans-serif;color:#eee;flex:1 1 200px;min-width:0}

#jsui .opn .sg button,#jsui .opn .pre button{border:0;border-radius:0;background:transparent;font:600 12.5px system-ui,sans-serif;letter-spacing:.04em;padding:9px 13px;color:#b5b5bc;border-right:1px solid #2a2a30}
#jsui .opn .pre button{flex:1;padding:12px 8px;font-size:13px;letter-spacing:.08em}
#jsui .opn .sg button:last-child,#jsui .opn .pre button:last-child{border-right:0}
#jsui .opn .sg button:hover,#jsui .opn .pre button:hover{background:#2a2a31;color:#fff;border-color:#2a2a30}

.opn .meter{background:#17171a;border:1px solid #2c2c32;border-radius:8px;padding:11px 14px}

.opn .mh b{font-size:13px}
.opn .bar{height:7px;background:#26262b;border-radius:4px;overflow:hidden}
.opn .bar i{display:block;height:100%;border-radius:4px;transition:width .25s}
.opn .sl{display:flex;align-items:center;gap:12px}
.opn .sl input{width:200px;accent-color:#ffcc00}
.opn .sl span{font:600 13px monospace;color:#ffcc00;min-width:52px;text-align:right}
@media(max-width:560px){.opn .sg{width:100%}.opn .sg button{flex:1}.opn .ob,.opn .oh,.opn .of{padding-left:16px;padding-right:16px}}
body.inmenu>*:not(#gl):not(#jsui):not(script){visibility:hidden}
.card{position:fixed;top:18%;left:50%;transform:translateX(-50%);z-index:20;text-align:center;font-family:"Arial Black",Impact,sans-serif;color:#ffcc00;text-shadow:2px 2px 0 #000;animation:cd 4.2s forwards;pointer-events:none}
.card small{display:block;letter-spacing:.4em;color:#fff;font-size:14px}.card b{font-size:clamp(28px,6vw,54px);font-style:italic}
@keyframes cd{0%{opacity:0;top:15%}12%,80%{opacity:1;top:18%}100%{opacity:0}}
</style>
</head>
<body>
<script>document.body.classList.add("inmenu")</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>

// ---------- CONFIG ----------
const CITY_SIZE = 8; // blocks per side
const BLOCK = 40; // size of one block (road+building) in world units
const ROAD_W = 8;
const BUILD_W = BLOCK - ROAD_W;

// ---------- GRAPHICS QUALITY STATE ----------
let gfxQuality = 'fancy';

// ---------- SCENE ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a2a3a);
scene.fog = new THREE.Fog(0x1a2a3a, 60, 220);

const camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.1, 1000);
camera.position.set(0, 40, 60);
camera.lookAt(0,0,0);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

// ---------- LIGHTS ----------
const sun = new THREE.DirectionalLight(0xffe8cc, 1.4);
sun.position.set(80,120,40);
sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left   = -200;
sun.shadow.camera.right  =  200;
sun.shadow.camera.top    =  200;
sun.shadow.camera.bottom = -200;
sun.shadow.camera.far    =  500;
sun.shadow.bias = -0.0003;
scene.add(sun);

const hemi = new THREE.HemisphereLight(0x88aacc, 0x334422, 0.7);
scene.add(hemi);

const fill = new THREE.DirectionalLight(0x8899bb, 0.25);
fill.position.set(-60, 40, -80);
scene.add(fill);

// ---------- MATERIALS ----------
// Simple = MeshLambert (original look). Fancy = MeshPhong with specular.
function makeMat(color, shininess=30, specular=0x222222){
  return {
    simple: new THREE.MeshLambertMaterial({color}),
    fancy:  new THREE.MeshPhongMaterial({color, shininess, specular}),
  };
}
const MAT_SETS = {
  road:     makeMat(0x2b2b2e, 8,  0x111111),
  sidewalk: makeMat(0x6b6b66, 10, 0x1a1a1a),
  grass:    makeMat(0x3a6b35, 5,  0x111111),
};
const MAT = new Proxy({}, {
  get(_, key){ return MAT_SETS[key][gfxQuality] || MAT_SETS[key].simple; }
});

const ROOFS=[];
const buildingBaseColors = [0x8899aa, 0x99887a, 0x778877, 0xaa9988, 0x7788aa, 0x998877];
function buildingMat(seed){
  const c = buildingBaseColors[seed % buildingBaseColors.length];
  return gfxQuality === 'fancy'
    ? new THREE.MeshPhongMaterial({color:c, shininess:60, specular:0x334455})
    : new THREE.MeshLambertMaterial({color:c});
}

// shared fancy-only materials (created once)
const winMat   = new THREE.MeshPhongMaterial({color:0x88ccff, emissive:0x223344, shininess:120, specular:0xaaddff});
const doorMat  = new THREE.MeshLambertMaterial({color:0x553322});
const treeTrunkMat = new THREE.MeshLambertMaterial({color:0x5c3d1a});
const treeFoliageMats = [
  new THREE.MeshPhongMaterial({color:0x2d6b35, shininess:15}),
  new THREE.MeshPhongMaterial({color:0x3a7a3a, shininess:15}),
  new THREE.MeshPhongMaterial({color:0x1e5528, shininess:15}),
];
const bushMat = new THREE.MeshPhongMaterial({color:0x2a5c28, shininess:8});

// Group that holds all fancy-only scene objects — toggled visible/invisible
const fancyGroup = new THREE.Group();
scene.add(fancyGroup);

function applyQuality(){
  if(gfxQuality === 'fancy'){
    renderer.shadowMap.type      = THREE.PCFSoftShadowMap;
    renderer.toneMapping         = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
    scene.fog = new THREE.Fog(0x1a3050, 80, 320);
    scene.background.set(0x1a3050);
    hemi.intensity = 0.7;
    fill.intensity = 0.25;
    sun.intensity  = 1.4;
    waterMat.shininess = 120;
    fancyGroup.visible = true;
  } else {
    // simple = original pre-upgrade settings
    renderer.shadowMap.type      = THREE.BasicShadowMap;
    renderer.toneMapping         = THREE.NoToneMapping;
    renderer.toneMappingExposure = 1.0;
    renderer.setPixelRatio(1);
    scene.fog = new THREE.Fog(0x1a2a3a, 60, 220);
    scene.background.set(0x1a2a3a);
    hemi.intensity = 0.3;
    fill.intensity = 0.0;
    sun.intensity  = 1.1;
    waterMat.shininess = 0;
    fancyGroup.visible = false;
  }
  renderer.shadowMap.needsUpdate = true;

  cityGroup.children.forEach(obj=>{
    if(!obj.material) return;
    const cur = obj.material;
    if(cur === MAT_SETS.road.simple     || cur === MAT_SETS.road.fancy)     obj.material = MAT_SETS.road[gfxQuality];
    if(cur === MAT_SETS.sidewalk.simple || cur === MAT_SETS.sidewalk.fancy) obj.material = MAT_SETS.sidewalk[gfxQuality];
  });
  ground.material = MAT_SETS.grass[gfxQuality];
}



// simple deterministic PRNG so the city is stable across reloads
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  }
}
const rand = mulberry32(1337);

// ---------- GROUND ----------
const groundSize = CITY_SIZE*BLOCK + 80;
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(groundSize, groundSize),
  MAT.grass
);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);

// ---------- WATER ----------
// Large plane sitting just below ground level, extends well beyond the city.
// Animated shimmer via vertex color oscillation each frame (cheap — no shader needed).
const WATER_SIZE = 2400;
const waterGeo = new THREE.PlaneGeometry(WATER_SIZE, WATER_SIZE, 24, 24);
const waterMat = new THREE.MeshPhongMaterial({
  color: 0x1a4a8a,
  transparent: true,
  opacity: 0.88,
  shininess: 120,
  specular: 0x88bbff,
});
const waterMesh = new THREE.Mesh(waterGeo, waterMat);
waterMesh.rotation.x = -Math.PI/2;
waterMesh.position.y = -0.4; // just below ground so city land sits above it
waterMesh.receiveShadow = false;
scene.add(waterMesh);

// thin foam/shore ring — a slightly lighter plane at the city's edge
const shoreSize = groundSize + 10;
const shoreMat = new THREE.MeshLambertMaterial({ color: 0x4a88cc, transparent: true, opacity: 0.6 });
const shoreMesh = new THREE.Mesh(new THREE.PlaneGeometry(shoreSize, shoreSize), shoreMat);
shoreMesh.rotation.x = -Math.PI/2;
shoreMesh.position.y = -0.18;
scene.add(shoreMesh);

// animate water color shimmer each frame
let waterTime = 0;
function animateWater(dt){
  waterTime += dt;
  const shimmer = Math.sin(waterTime * 1.4) * 0.04;
  waterMat.color.setRGB(0.1 + shimmer, 0.29 + shimmer, 0.54 + shimmer);
}

// city boundary — beyond this the player is in water
const CITY_BOUNDARY = groundSize / 2 + 8; // past the shore ring (±205), into actual water

// ---------- CITY GENERATION ----------
// Grid of blocks. Each cell is either a building lot or empty (park).
// Roads run between every cell on a regular grid (simplest possible GTA-ish layout).
const cityGroup = new THREE.Group();
scene.add(cityGroup);

const half = CITY_SIZE/2;
for(let gx=0; gx<CITY_SIZE; gx++){
  for(let gz=0; gz<CITY_SIZE; gz++){
    const cx = (gx-half)*BLOCK + BLOCK/2;
    const cz = (gz-half)*BLOCK + BLOCK/2;

    const sidewalk = new THREE.Mesh(new THREE.BoxGeometry(BUILD_W+2, 0.15, BUILD_W+2), MAT.sidewalk);
    sidewalk.position.set(cx, 0.08, cz);
    sidewalk.receiveShadow = true;
    cityGroup.add(sidewalk);

    // 10% park lots — simple mode gets bare grass; fancy gets trees and bushes
    if(rand() < 0.1){
      // fancy: fill park with trees and bushes
      const numTrees = 2 + Math.floor(rand()*3);
      for(let t=0; t<numTrees; t++){
        const tx = cx + (rand()-0.5)*BUILD_W*0.7;
        const tz = cz + (rand()-0.5)*BUILD_W*0.7;
        const trunkH = 3 + rand()*4;
        const canopyR = 2.5 + rand()*2.5;
        const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.4, trunkH, 6), treeTrunkMat);
        trunk.position.set(tx, trunkH/2, tz);
        trunk.castShadow = true;
        fancyGroup.add(trunk);
        // layered canopy (2 cones stacked) for more visual interest
        const fMat = treeFoliageMats[Math.floor(rand()*treeFoliageMats.length)];
        const cone1 = new THREE.Mesh(new THREE.ConeGeometry(canopyR, canopyR*1.4, 7), fMat);
        cone1.position.set(tx, trunkH + canopyR*0.5, tz);
        cone1.castShadow = true;
        fancyGroup.add(cone1);
        const cone2 = new THREE.Mesh(new THREE.ConeGeometry(canopyR*0.7, canopyR*1.1, 6), fMat);
        cone2.position.set(tx, trunkH + canopyR*1.1, tz);
        cone2.castShadow = true;
        fancyGroup.add(cone2);
      }
      // a few bushes too
      const numBushes = 2 + Math.floor(rand()*4);
      for(let b=0; b<numBushes; b++){
        const bx = cx + (rand()-0.5)*BUILD_W*0.8;
        const bz = cz + (rand()-0.5)*BUILD_W*0.8;
        const br = 0.7 + rand()*0.8;
        const bush = new THREE.Mesh(new THREE.SphereGeometry(br, 6, 5), bushMat);
        bush.position.set(bx, br*0.6, bz);
        bush.castShadow = true;
        fancyGroup.add(bush);
      }
      continue;
    }

    const floors = 1 + Math.floor(rand()*8);
    const h = floors * 4;
    const w = BUILD_W*0.7 + rand()*BUILD_W*0.2;
    const d = BUILD_W*0.7 + rand()*BUILD_W*0.2;
    const seed = Math.floor(rand()*1000);

    const building = new THREE.Mesh(
      new THREE.BoxGeometry(w, h, d),
      buildingMat(seed)
    );
    building.position.set(cx, h/2, cz);
    building.castShadow = true;
    building.receiveShadow = true;
    cityGroup.add(building);

    // roof detail
    ROOFS.push({cx,cz,h,w,d});

    // fancy: windows and doors
    // Each face defined by: normal axis, sign, face width, face depth
    // We iterate 4 faces: +X, -X, +Z, -Z
    const WIN_W = 0.85, WIN_H = 0.95;
    const WIN_THICK = 0.12; // window box thickness - mostly embedded in the wall
    const WIN_POKE = 0.03;  // how far the window pokes out past the building face (flush look)
    const FLOOR_H = 4;
    const WIN_Y_OFFSET = 1.8; // height of window centre above floor base

    const DOOR_W = 1.2, DOOR_H = 2.2, DOOR_THICK = 0.18;
    const DOOR_POKE = 0.03; // how far the door pokes out past the building face (flush look)
    const DOOR_CLEARANCE = DOOR_W/2 + WIN_W/2 + 0.2; // keep ground-floor windows clear of the door

    const faces = [
      { nx:1, nz:0, faceW:d, faceD:w, signX: 1, signZ:0 },  // +X face
      { nx:-1,nz:0, faceW:d, faceD:w, signX:-1, signZ:0 },  // -X face
      { nx:0, nz:1, faceW:w, faceD:d, signX:0,  signZ: 1 }, // +Z face
      { nx:0, nz:-1,faceW:w, faceD:d, signX:0,  signZ:-1 }, // -Z face
    ];

    faces.forEach((face, fi)=>{
      const cols = Math.max(1, Math.floor(face.faceW / 3.2));
      const colSpacing = face.faceW / (cols + 1);
      const hasDoor = face.nz !== 0;

      // face centre sits ON the building surface, offset only enough to poke past it
      const faceX = cx + face.nx * (face.faceD/2 - WIN_THICK/2 + WIN_POKE);
      const faceZ = cz + face.nz * (face.faceD/2 - WIN_THICK/2 + WIN_POKE);

      // lateral axis: if face normal is X, lateral is Z, and vice versa
      const latIsZ = face.nx !== 0;

      for(let row = 0; row < floors; row++){
        const wy = row * FLOOR_H + WIN_Y_OFFSET; // y from building base

        for(let col = 0; col < cols; col++){
          const lat = (col + 1) * colSpacing - face.faceW/2;

          // skip ground-floor windows that would overlap the door
          if(row === 0 && hasDoor && Math.abs(lat) < DOOR_CLEARANCE) continue;

          const win = new THREE.Mesh(
            new THREE.BoxGeometry(
              latIsZ ? WIN_THICK : WIN_W,
              WIN_H,
              latIsZ ? WIN_W     : WIN_THICK
            ),
            winMat
          );
          win.position.set(
            faceX + (latIsZ ? 0   : lat),
            building.position.y - h/2 + wy,
            faceZ + (latIsZ ? lat : 0)
          );
          fancyGroup.add(win);
        }
      }

      // door on ground floor of +Z and -Z faces only
      if(hasDoor){
        const door = new THREE.Mesh(
          new THREE.BoxGeometry(DOOR_W, DOOR_H, DOOR_THICK),
          doorMat
        );
        door.position.set(
          cx,
          building.position.y - h/2 + DOOR_H/2,
          cz + face.nz * (d/2 - DOOR_THICK/2 + DOOR_POKE)
        );
        fancyGroup.add(door);
      }
    });

    // fancy: small trees along sidewalk edge of this lot
    for(let st=0; st<2; st++){
      const tx = cx + (rand()-0.5)*w*0.5;
      const tz = cz + (d/2 + 1.5) * (st===0 ? 1 : -1);
      const trunkH = 2.5 + rand()*1.5;
      const canopyR = 1.5 + rand()*1.0;
      const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.22, trunkH, 6), treeTrunkMat);
      trunk.position.set(tx, trunkH/2, tz);
      trunk.castShadow = true;
      fancyGroup.add(trunk);
      const fMat = treeFoliageMats[Math.floor(rand()*treeFoliageMats.length)];
      const cone = new THREE.Mesh(new THREE.ConeGeometry(canopyR, canopyR*1.6, 6), fMat);
      cone.position.set(tx, trunkH + canopyR*0.5, tz);
      cone.castShadow = true;
      fancyGroup.add(cone);
    }
  }
}

// ---------- ROADS (full grid lines, drawn as long boxes for cheap geometry) ----------
const roadLen = CITY_SIZE*BLOCK;
const laneMarkMat = new THREE.MeshBasicMaterial({color:0xffffff});
const laneMarkMatY = new THREE.MeshBasicMaterial({color:0xffdd00}); // center yellow line
for(let i=0; i<=CITY_SIZE; i++){
  const pos = (i-half)*BLOCK;
  // road running along X
  const rx = new THREE.Mesh(new THREE.BoxGeometry(roadLen, 0.1, ROAD_W), MAT.road);
  rx.position.set(0, 0.05, pos);
  rx.receiveShadow = true;
  cityGroup.add(rx);
  // road running along Z
  const rz = new THREE.Mesh(new THREE.BoxGeometry(ROAD_W, 0.1, roadLen), MAT.road);
  rz.position.set(pos, 0.05, 0);
  rz.receiveShadow = true;
  cityGroup.add(rz);

  // centre yellow dashes along X road
  for(let d=0; d<CITY_SIZE; d++){
    const dx = (d - CITY_SIZE/2 + 0.5)*BLOCK;
    const dashX = new THREE.Mesh(new THREE.BoxGeometry(BLOCK*0.4, 0.12, 0.18), laneMarkMatY);
    dashX.position.set(dx, 0.11, pos);
    cityGroup.add(dashX);
    // centre yellow dashes along Z road
    const dashZ = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.12, BLOCK*0.4), laneMarkMatY);
    dashZ.position.set(pos, 0.11, dx);
    cityGroup.add(dashZ);
  }
}

// =========================================================
// COLLISION DATA — collect building AABBs + tree trunk circles for cheap
// static-obstacle tests (no physics engine, just simple overlap checks)
// =========================================================
const buildingBoxes = [];
cityGroup.children.forEach(obj=>{
  if(obj.geometry && obj.geometry.type === 'BoxGeometry' && obj.geometry.parameters.height > 1){
    obj.updateMatrixWorld();
    const box = new THREE.Box3().setFromObject(obj);
    buildingBoxes.push(box);
  }
});

// tree trunks are the only cylinders ever added to fancyGroup, so this
// picks them up cleanly (both the yard trees and the sidewalk trees)
const treeColliders = [];
fancyGroup.children.forEach(obj=>{
  if(obj.material === treeTrunkMat && obj.geometry && obj.geometry.type === 'CylinderGeometry'){
    treeColliders.push({
      x: obj.position.x,
      z: obj.position.z,
      r: obj.geometry.parameters.radiusBottom,
    });
  }
});

function circleHitsAnyObstacle(x, z, radius){
  for(const b of buildingBoxes){
    const closestX = Math.max(b.min.x, Math.min(x, b.max.x));
    const closestZ = Math.max(b.min.z, Math.min(z, b.max.z));
    const dx = x - closestX, dz = z - closestZ;
    if(dx*dx + dz*dz < radius*radius) return true;
  }
  if(fancyGroup.visible){
    for(const t of treeColliders){
      const dx = x - t.x, dz = z - t.z;
      const minDist = radius + t.r;
      if(dx*dx + dz*dz < minDist*minDist) return true;
    }
  }
  return false;
}

// =========================================================
// VEHICLE — built from primitives, arcade-style physics
// =========================================================
function buildCar(color){
  const car = new THREE.Group();

  const bodyGeo = new THREE.BoxGeometry(2.2, 0.9, 4.4);
  const body = new THREE.Mesh(bodyGeo, new THREE.MeshLambertMaterial({color}));
  body.position.y = 0.7;
  body.castShadow = true;
  car.add(body);

  const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.9, 0.7, 2.2), new THREE.MeshLambertMaterial({color:0x223344}));
  cabin.position.set(0, 1.4, -0.2);
  cabin.castShadow = true;
  car.add(cabin);

  const wheelGeo = new THREE.CylinderGeometry(0.45, 0.45, 0.4, 10);
  const wheelMat = new THREE.MeshLambertMaterial({color:0x111111});
  const wheelPositions = [
    [-1.15, 0.45, 1.4], [1.15, 0.45, 1.4],
    [-1.15, 0.45, -1.4], [1.15, 0.45, -1.4]
  ];
  car.userData.wheels = [];
  wheelPositions.forEach(p=>{
    const w = new THREE.Mesh(wheelGeo, wheelMat);
    w.rotation.z = Math.PI/2;
    w.position.set(...p);
    w.castShadow = true;
    car.add(w);
    car.userData.wheels.push(w);
  });

  [-0.7, 0.7].forEach(x=>{
    const hl = new THREE.Mesh(new THREE.BoxGeometry(0.3,0.2,0.1), new THREE.MeshBasicMaterial({color:0xffffcc}));
    hl.position.set(x, 0.7, 2.25);
    car.add(hl);
  });

  return car;
}

// low-poly motorcycle + seated rider, same primitive style as buildCar/buildPed.
// Two in-line wheels instead of four in a rectangle, so this is its own builder
// rather than a variant of buildCar. userData.wheels is still an array (of 2,
// not 4) so the existing "spin the wheels by speed" code elsewhere, which just
// does .forEach over whatever's in that array, keeps working unmodified.
function buildMotorcycle(bodyColor, riderColor){
  const bike = new THREE.Group();

  // frame — a slim low box standing in for the body/engine block
  const frame = new THREE.Mesh(
    new THREE.BoxGeometry(0.5, 0.5, 2.0),
    new THREE.MeshLambertMaterial({color:bodyColor})
  );
  frame.position.y = 0.55;
  frame.castShadow = true;
  bike.add(frame);

  // seat, slightly raised and set back
  const seat = new THREE.Mesh(
    new THREE.BoxGeometry(0.4, 0.15, 0.7),
    new THREE.MeshLambertMaterial({color:0x1a1a1a})
  );
  seat.position.set(0, 0.85, -0.3);
  seat.castShadow = true;
  bike.add(seat);

  // handlebar, positioned to match where the rider's hand actually lands at
  // the arm rotation set below (computed from the fixed shoulder-pivot and
  // arm-mesh dimensions in buildPed — not just eyeballed) rather than placed
  // independently of the pose, which is what left the hands floating well
  // short of the bars before
  const handlebar = new THREE.Mesh(
    new THREE.BoxGeometry(0.9, 0.08, 0.12),
    new THREE.MeshLambertMaterial({color:0x333333})
  );
  handlebar.position.set(0, 1.66, 0.28);
  handlebar.castShadow = true;
  bike.add(handlebar);

  // two in-line wheels (front/back), not four — same cylinder geo/material as buildCar
  const wheelGeo = new THREE.CylinderGeometry(0.42, 0.42, 0.28, 10);
  const wheelMat = new THREE.MeshLambertMaterial({color:0x111111});
  const wheelZPositions = [1.0, -1.0]; // front, back
  bike.userData.wheels = [];
  wheelZPositions.forEach(z=>{
    const w = new THREE.Mesh(wheelGeo, wheelMat);
    w.rotation.z = Math.PI/2;
    w.position.set(0, 0.42, z);
    w.castShadow = true;
    bike.add(w);
    bike.userData.wheels.push(w);
  });

  // headlight, front-facing
  const hl = new THREE.Mesh(new THREE.BoxGeometry(0.2,0.2,0.1), new THREE.MeshBasicMaterial({color:0xffffcc}));
  hl.position.set(0, 0.75, 1.05);
  bike.add(hl);

  // seated rider — reuse buildPed for the same low-poly humanoid, then fold
  // the legs/arms into a rough riding pose instead of the standing default
  const rider = buildPed(riderColor);
  rider.position.set(0, 0.35, -0.25);
  rider.userData.legL.rotation.x = -1.1; // bent forward onto the pegs
  rider.userData.legR.rotation.x = -1.1;
  rider.userData.armL.rotation.x = -1.309; // -75°: derived so the hand-end math lands at the handlebar position above, not guessed
  rider.userData.armR.rotation.x = -1.309;
  bike.add(rider);
  bike.userData.rider = rider;

  return bike;
}

// PLAYER (on-foot) — simple low-poly humanoid

function buildPed(color){
  const g = new THREE.Group();
  const torso = new THREE.Mesh(new THREE.BoxGeometry(0.6,0.8,0.35), new THREE.MeshLambertMaterial({color}));
  torso.position.y = 1.1;
  torso.castShadow = true;
  g.add(torso);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.25,8,8), new THREE.MeshLambertMaterial({color:0xe0b090}));
  head.position.y = 1.75;
  head.castShadow = true;
  g.add(head);

  // arms — pivot at shoulder so they swing forward on punch
  const armGeo = new THREE.BoxGeometry(0.18, 0.55, 0.2);
  const armMat = new THREE.MeshLambertMaterial({color});
  const armLPivot = new THREE.Group(); armLPivot.position.set(-0.42, 1.45, 0); g.add(armLPivot);
  const armLMesh  = new THREE.Mesh(armGeo, armMat); armLMesh.position.y = -0.28; armLMesh.castShadow = true; armLPivot.add(armLMesh);
  const armRPivot = new THREE.Group(); armRPivot.position.set( 0.42, 1.45, 0); g.add(armRPivot);
  const armRMesh  = new THREE.Mesh(armGeo, armMat); armRMesh.position.y = -0.28; armRMesh.castShadow = true; armRPivot.add(armRMesh);
  g.userData.armL = armLPivot;
  g.userData.armR = armRPivot;

  const legGeo = new THREE.BoxGeometry(0.22, 0.8, 0.25);
  const legMat = new THREE.MeshLambertMaterial({color:0x223355});

  // pivot group sits at the hip joint; mesh is offset down so its top aligns with the pivot
  const legLPivot = new THREE.Group(); legLPivot.position.set(-0.16, 0.8, 0); g.add(legLPivot);
  const legLMesh  = new THREE.Mesh(legGeo, legMat); legLMesh.position.y = -0.4; legLMesh.castShadow = true; legLPivot.add(legLMesh);

  const legRPivot = new THREE.Group(); legRPivot.position.set( 0.16, 0.8, 0); g.add(legRPivot);
  const legRMesh  = new THREE.Mesh(legGeo, legMat); legRMesh.position.y = -0.4; legRMesh.castShadow = true; legRPivot.add(legRMesh);

  g.userData.legL = legLPivot;
  g.userData.legR = legRPivot;
  return g;
}

  pointerLocked = !!document.pointerLockElement;
  if(pointerLocked){
    // successfully locked — hide everything
    gameStarted = true;
    lockOverlay.style.display = 'none';
    settingsMenu.style.display = 'none';
    menuOpen = false;
  } else if(menuOpen){
    // lock released because menu opened — keep menu visible, hide start overlay
    lockOverlay.style.display = 'none';
    settingsMenu.style.display = 'flex';
  } else if(gameStarted){
    // lock released mid-game — most commonly the browser's own Escape handling,
    // which exits pointer lock before (or without) our keydown handler ever
    // seeing it. That's what the pause menu is for, so open it — never the
    // click-to-start splash, which is a one-time first-run screen only.
    openMenu();
  } else {
    // haven't started yet — show the click-to-start overlay
    lockOverlay.style.display = 'flex';
  }
});

  // Resume lost its "user gesture" by the time the frame ran) — fall back to
  // the pause menu if we've already started, since the splash is first-run only.
  console.warn('Pointer lock failed');
  if(menuOpen) return;
  if(gameStarted) openMenu();

});

});

const ENTER_RANGE_SQ = 9; // 3 units — matches the old fixed enter/exit range

function tryEnterExit(){
  if(mode === 'foot'){
    const dx = playerPed.position.x - car.obj.position.x;
    const dz = playerPed.position.z - car.obj.position.z;
    if(dx*dx + dz*dz < ENTER_RANGE_SQ){
      // get back into whatever we're currently assigned to drive
      mode = 'car';
      playerPed.visible = false;
      cameraYaw = car.heading + Math.PI;
      return;
    }
    const stealTarget = findStealableCar(playerPed.position);
    if(stealTarget){
      stealCar(stealTarget);
      mode = 'car';
      playerPed.visible = false;
      cameraYaw = car.heading + Math.PI;
    }
  } else {
    mode = 'foot';
    playerPed.position.set(
      car.obj.position.x + Math.cos(car.heading) * 3,
      0,
      car.obj.position.z - Math.sin(car.heading) * 3
    );
    playerPed.visible = true;
    car.speed = 0;
    cameraYaw = car.heading + Math.PI;
  }
}

// Finds the nearest car-shaped thing in range that isn't the one we're already
// driving: a moving traffic car, a cop car (while the cop's still driving it —
// once the cop bails out on foot the car goes invisible and isn't there to
// steal), or a vehicle abandoned earlier by the player.
function findStealableCar(playerPos){
  let best = null, bestDistSq = ENTER_RANGE_SQ;
  const consider = (kind, ref, x, z)=>{
    const dx = x - playerPos.x, dz = z - playerPos.z;
    const d2 = dx*dx + dz*dz;
    if(d2 < bestDistSq){ bestDistSq = d2; best = {kind, ref}; }
  };
  trafficCars.forEach(t=>{ if(t.alive) consider('traffic', t, t.obj.position.x, t.obj.position.z); });
  copCars.forEach(c=>{ if(c.alive && !c.onFoot) consider('cop', c, c.obj.position.x, c.obj.position.z); });
  parkedCars.forEach(p=> consider('parked', p, p.obj.position.x, p.obj.position.z));
  return best;
}

// Spawns a ped that's just been hauled out of the driver's seat: they land on
// the ground beside the car, lie there stunned for a moment, then scramble up
// and flee like any other startled civilian.
function ejectDriver(x, z, heading, color){
  const g = buildPed(color);
  const ex = x + Math.sin(heading + Math.PI*0.5) * 1.6;
  const ez = z + Math.cos(heading + Math.PI*0.5) * 1.6;
  g.position.set(ex, 0, ez);
  g.rotation.x = -Math.PI/2; // knocked flat onto the ground
  scene.add(g);
  npcPeds.push({
    obj: g,
    heading: heading + Math.PI,
    targetHeading: heading + Math.PI,
    speed: 0,
    maxSpeed: 2.6 + rand()*1.6,
    radius: 0.35,
    walkCycle: rand()*10,
    state: 'downed',   // lies on the ground briefly before transitioning to 'flee'
    stateTimer: 0.9 + rand()*0.4,
    alive: true,
    hp: 3,
  });
}

function stealCar(target){
  // whatever we're driving now (or last parked) gets left behind as a solid,
  // stealable-again obstacle
  parkedCars.push({ obj: car.obj, speed: 0, pushVX: 0, pushVZ: 0 });

  const stolenObj = target.ref.obj;
  const stolenHeading = target.ref.heading !== undefined ? target.ref.heading : car.heading;

  if(target.kind === 'traffic'){
    ejectDriver(stolenObj.position.x, stolenObj.position.z, stolenHeading, pedColors[Math.floor(rand()*pedColors.length)]);
    trafficCars.splice(trafficCars.indexOf(target.ref), 1);
    maybeCrime(); // 50% chance: stealing a car is a crime
  } else if(target.kind === 'cop'){
    ejectDriver(stolenObj.position.x, stolenObj.position.z, stolenHeading, 0x1144cc);
    commitCrime(2); // always 2 stars: stealing a cop car
    copCars.splice(copCars.indexOf(target.ref), 1);
  } else if(target.kind === 'parked'){
    parkedCars.splice(parkedCars.indexOf(target.ref), 1);
    maybeCrime(); // 50% chance even on parked cars
  }

  car.obj = stolenObj;
  car.heading = stolenHeading;
  car.speed = 0;
  car.wheelSpin = 0;
}

// =========================================================
// PUNCH SYSTEM
// =========================================================
const PUNCH_RANGE    = 2.5;  // units in front of player
const PUNCH_COOLDOWN = 0.55; // seconds between punches

function tryPunch(){
  if(ped.punchCooldown > 0) return;
  ped.punching = true;
  ped.punchAnim = 0;
  ped.punchCooldown = PUNCH_COOLDOWN;
  doPunchHits();
}

function doPunchHits(){
  // hit zone: a point PUNCH_RANGE units directly in front of the player
  const hitX = playerPed.position.x + Math.sin(ped.heading) * PUNCH_RANGE;
  const hitZ = playerPed.position.z + Math.cos(ped.heading) * PUNCH_RANGE;

  // hit NPCs
  npcPeds.forEach(p=>{
    if(!p.alive) return;
    const dx = p.obj.position.x - hitX;
    const dz = p.obj.position.z - hitZ;
    if(dx*dx + dz*dz < 2.0){
      p.hp--;
      p.state = 'flee'; // always flee when hit
      p.heading = Math.atan2(
        p.obj.position.x - playerPed.position.x,
        p.obj.position.z - playerPed.position.z
      );
      if(p.hp <= 0){
        p.alive = false;
        scene.remove(p.obj);
        maybeCrime(); // 50% chance on kill — separate from the proximity check below
      }
      // punching a civilian (alive or killed) near a cop is also a 50% crime
      const copNearby = copCars.some(c=> c.alive && !c.onFoot &&
        Math.hypot(c.obj.position.x - playerPed.position.x,
                   c.obj.position.z - playerPed.position.z) < 25);
      const footCopNearby = copCars.some(c=> c.alive && c.onFoot &&
        Math.hypot(c.copPed.position.x - playerPed.position.x,
                   c.copPed.position.z - playerPed.position.z) < 25);
      if(copNearby || footCopNearby) maybeCrime();
    }
  });

  // hit on-foot cops
  copCars.forEach(c=>{
    if(!c.alive || !c.onFoot) return;
    const dx = c.copPed.position.x - hitX;
    const dz = c.copPed.position.z - hitZ;
    if(dx*dx + dz*dz < 2.0){
      c.copHp--;
      if(c.copHp <= 0){
        scene.remove(c.copPed);
        c.alive = false;
        commitCrime(2); // killing a cop always adds 2 stars
      }
    }
  });
}

function updatePunchAnim(dt){
  if(!ped.punching) {
    // idle: arms hang at sides (rotation.x = 0), drift back smoothly
    const armL = playerPed.userData.armL;
    const armR = playerPed.userData.armR;
    if(armL) armL.rotation.x = THREE.MathUtils.lerp(armL.rotation.x, 0, dt*10);
    if(armR) armR.rotation.x = THREE.MathUtils.lerp(armR.rotation.x, 0, dt*10);
    return;
  }

  ped.punchAnim += dt / (PUNCH_COOLDOWN * 0.6);
  if(ped.punchAnim >= 1){
    ped.punchAnim = 1;
    ped.punching = false;
  }

  // right arm jabs forward (negative X rotation = forward swing) then snaps back
  const swing = Math.sin(ped.punchAnim * Math.PI) * -1.4; // full forward swing arc
  const armR = playerPed.userData.armR;
  const armL = playerPed.userData.armL;
  if(armR) armR.rotation.x = swing;
  // left arm swings slightly back for balance
  if(armL) armL.rotation.x = -swing * 0.3;
}



// =========================================================
// CAMERA RIG — mouse-look third-person orbit
// =========================================================
const CAM_DIST   = 10;   // orbit radius (distance from player)
const CAM_HEIGHT =  6;   // base height above player
let camCurrentPos = new THREE.Vector3(0, 20, 30);

// car-mode: camera free-orbits with the mouse and lazily recenters behind the car
// when the player isn't actively looking around

// =========================================================
// UPDATE LOOP
// =========================================================
const clock = new THREE.Clock();

function updateCar(dt){
  const forward = keys['KeyW'] || keys['ArrowUp'];
  const back    = keys['KeyS'] || keys['ArrowDown'];
  const left    = keys['KeyA'] || keys['ArrowLeft'];
  const right   = keys['KeyD'] || keys['ArrowRight'];

  if(forward)      car.speed += car.accel * (1 - 0.4 * Math.min(1, Math.abs(car.speed) / car.maxSpeed)) * dt;
  else if(back)    car.speed -= (car.speed > 0 ? car.brakeForce : car.accel) * dt;
  else {
    if(car.speed > 0) car.speed = Math.max(0, car.speed - car.friction * dt);
    else if(car.speed < 0) car.speed = Math.min(0, car.speed + car.friction * dt);
  }
  car.speed = THREE.MathUtils.clamp(car.speed, car.maxReverse, car.maxSpeed);

  // steering is still wheel-relative (A/D turns the car, not the camera)
  const steerInput = (left ? 1 : 0) - (right ? 1 : 0);
  // bicycle-model steering: wheel lock shrinks with speed, turn rate follows speed/wheelbase, and tire grip caps sideways force
  const av = Math.abs(car.speed), sf = Math.min(1, av / car.maxSpeed);
  const maxSteer = 0.65 - 0.52 * Math.pow(sf, 0.6);
  car.steer = (car.steer || 0) + (steerInput * maxSteer - (car.steer || 0)) * Math.min(1, dt * 7);
  if(av > 0.05){
    const grip = 30 / Math.max(av, 1);
    car.heading += THREE.MathUtils.clamp((car.speed / 2.8) * Math.tan(car.steer), -grip, grip) * dt;
    car.speed -= car.speed * Math.abs(car.steer) * sf * 0.8 * dt; // tire scrub when cornering hard
  } else if(steerInput !== 0){
    // low/zero-speed creep turn — lets the player crank the wheel to angle
    // out of a pileup (wedged against another car or a wall) even when
    // car.speed can't sustain above the 0.05 threshold above, which is
    // exactly the state a pinned car sits in every frame: obstacle
    // collision below keeps knocking speed back toward/through zero, so
    // normal steering never gets a window to fire. Real cars can inch
    // and turn at the same time even from a near-stop; this mirrors that
    // with a small fixed rate, independent of speedFactor since there's
    // no meaningful "speed" to scale off here.
    // no turning in place: the car must be rolling to steer
  }

  // tiny creep so a fully stationary, wedged car still has *some* motion to
  // combine with the creep-turn above — turning the wheel alone reorients
  // the car in place, but without any drift the player can end up
  // perfectly re-aimed and still touching the same obstacle from the same
  // spot. Only fires on pure wheel-crank (no W/S held): if the player IS
  // holding W or S, the accel/brake logic above already gives them real
  // speed in that direction, so this only needs to cover the "just
  // steering" case.
  if(steerInput !== 0 && Math.abs(car.speed) <= 0.05 && !forward && !back){
    // no creep: a stopped car stays stopped
  }

  const dx = Math.sin(car.heading) * car.speed * dt;
  const dz = Math.cos(car.heading) * car.speed * dt;
  const nx = car.obj.position.x + dx;
  const nz = car.obj.position.z + dz;

  const r = 1.6;
  if(!circleHitsAnyObstacle(nx, nz, r)){
    car.obj.position.x = nx;
    car.obj.position.z = nz;
  } else {
    // Slide along the wall: keep whichever axis is still free. Only the part of
    // the speed pointing INTO the wall is lost, so scraping the side of a
    // building keeps you rolling; a head-on hit still stops/bounces you.
    const okX = !circleHitsAnyObstacle(nx, car.obj.position.z, r);
    const okZ = !circleHitsAnyObstacle(car.obj.position.x, nz, r);
    if(okX || okZ){
      const head = okX ? Math.abs(Math.cos(car.heading)) : Math.abs(Math.sin(car.heading)); // fraction aimed into the wall
      if(okX) car.obj.position.x = nx; else car.obj.position.z = nz;
      const into = Math.abs(car.speed) * head;
      if(into > 10) damagePlayer((into - 10) * 0.6);
      car.speed *= (1 - 0.7 * head);
    } else {
      if(Math.abs(car.speed) > 10){
        damagePlayer((Math.abs(car.speed) - 10) * 0.6);
      }
      car.speed *= -0.5;
    }
  }

  car.obj.rotation.y = car.heading;
  car.wheelSpin += car.speed * dt * 2;
  car.obj.userData.wheels.forEach(w => { w.rotation.x = car.wheelSpin; });
}

function updatePed(dt){
  const forward = keys['KeyW'] || keys['ArrowUp'];
  const back    = keys['KeyS'] || keys['ArrowDown'];
  const left    = keys['KeyA'] || keys['ArrowLeft'];
  const right   = keys['KeyD'] || keys['ArrowRight'];

  // raw WASD input axes (input space, pre-camera-rotation)
  let moveX = 0, moveZ = 0;
  if(forward) moveZ -= 1;
  if(back)    moveZ += 1;
  if(left)    moveX += 1;
  if(right)   moveX -= 1;

  const moving = moveX !== 0 || moveZ !== 0;
  if(moving){
    // camera-relative heading: rotate the input vector by cameraYaw so W always means
    // "move toward where the camera is looking". Camera orbits from *behind* the player
    // so its yaw is 180° opposite the player's forward — add PI to correct for that.
    const inputHeading = Math.atan2(moveX, -moveZ);
    ped.heading = cameraYaw + inputHeading + Math.PI;
    ped.speed = THREE.MathUtils.lerp(ped.speed, ped.maxSpeed, dt * 6);
  } else {
    ped.speed = THREE.MathUtils.lerp(ped.speed, 0, dt * 8);
  }

  const dx = Math.sin(ped.heading) * ped.speed * dt;
  const dz = Math.cos(ped.heading) * ped.speed * dt;
  const nx = ped.obj.position.x + dx;
  const nz = ped.obj.position.z + dz;

  if(!circleHitsAnyObstacle(nx, nz, ped.radius)){
    ped.obj.position.x = nx;
    ped.obj.position.z = nz;
  }

  // character visually faces where they're actually moving (not the camera),
  // so strafing looks correct — they run sideways relative to the camera when needed
  ped.obj.rotation.y = ped.heading;

  if(moving){
    ped.walkCycle += dt * 10;
    const swing = Math.sin(ped.walkCycle) * 0.5;
    ped.obj.userData.legL.rotation.x =  swing;
    ped.obj.userData.legR.rotation.x = -swing;
  } else {
    ped.obj.userData.legL.rotation.x = THREE.MathUtils.lerp(ped.obj.userData.legL.rotation.x, 0, dt * 8);
    ped.obj.userData.legR.rotation.x = THREE.MathUtils.lerp(ped.obj.userData.legR.rotation.x, 0, dt * 8);
  }
}

function lerpAngle(from, to, t){
  let diff = to - from;
  while(diff >  Math.PI) diff -= Math.PI * 2;
  while(diff < -Math.PI) diff += Math.PI * 2;
  return from + diff * t;
}

// Collect building meshes once for camera raycasting
// (only tall boxes — same criterion as buildingBoxes for collision)
const camCollideMeshes = [];
cityGroup.children.forEach(obj=>{
  if(obj.isMesh && obj.geometry && obj.geometry.type === 'BoxGeometry'
     && obj.geometry.parameters.height > 1){
    camCollideMeshes.push(obj);
  }
});
const camRaycaster = new THREE.Raycaster();

function updateCamera(dt){
  const target = mode === 'car' ? car.obj : ped.obj;

  if(mode === 'car'){
    carCamRecenterTimer += dt;
    if(carCamRecenterTimer > 1.5){
      const targetYaw = car.heading + Math.PI;
      cameraYaw = lerpAngle(cameraYaw, targetYaw, 1 - Math.pow(0.005, dt));
    }
  }

  const sinYaw   = Math.sin(cameraYaw);
  const cosYaw   = Math.cos(cameraYaw);
  const sinPitch = Math.sin(cameraPitch);
  const cosPitch = Math.cos(cameraPitch);

  const offsetX = sinYaw * cosPitch * CAM_DIST;
  const offsetY = sinPitch * CAM_DIST + CAM_HEIGHT;
  const offsetZ = cosYaw * cosPitch * CAM_DIST;

  const desired = new THREE.Vector3(
    target.position.x + offsetX,
    target.position.y + offsetY,
    target.position.z + offsetZ
  );

  // ---- camera collision: raycast from player toward desired camera position ----
  // origin is slightly above the player's centre (eye level)
  const eyePos = new THREE.Vector3(target.position.x, target.position.y + 1.4, target.position.z);
  const camDir = desired.clone().sub(eyePos);
  const camDist = camDir.length();
  camDir.normalize();

  camRaycaster.set(eyePos, camDir);
  camRaycaster.far = camDist + 0.1;
  const hits = camRaycaster.intersectObjects(camCollideMeshes, false);

  let finalPos;
  if(hits.length > 0 && hits[0].distance < camDist){
    // pull camera to just in front of the first hit, with a small margin
    const pullDist = Math.max(0.5, hits[0].distance - 0.4);
    finalPos = eyePos.clone().addScaledVector(camDir, pullDist);
    // keep camCurrentPos in sync so the lerp resumes from here, not from the old position
    camCurrentPos.copy(finalPos);
  } else {
    // clear path — smooth lerp toward desired
    camCurrentPos.lerp(desired, 1 - Math.pow(0.001, dt));
    finalPos = camCurrentPos;
  }

  camera.position.copy(finalPos);
  camera.lookAt(target.position.x, target.position.y + 1.2, target.position.z);
}

const npcPeds = [];
const NUM_PEDS = 18;
const pedColors = [0xcc6633, 0x33aa66, 0xaa3399, 0xddcc33, 0x33aacc, 0xbb4444, 0x44bb88];

function spawnPed(x, z){
  const g = buildPed(pedColors[Math.floor(rand()*pedColors.length)]);
  g.position.set(x, 0, z);
  scene.add(g);
  npcPeds.push({
    obj: g,
    heading: rand()*Math.PI*2,
    targetHeading: rand()*Math.PI*2,
    speed: 0,
    maxSpeed: 2.2 + rand()*1.8,
    radius: 0.35,
    walkCycle: rand()*10,
    state: 'wander',   // 'wander' | 'idle' | 'flee'
    stateTimer: rand()*4,
    alive: true,
    hp: 3,
  });
}

for(let i=0;i<NUM_PEDS;i++){
  let cx, cz, attempts = 0;
  do {
    const gx = Math.floor(rand()*CITY_SIZE);
    const gz = Math.floor(rand()*CITY_SIZE);
    cx = (gx-half)*BLOCK + BLOCK/2 + (rand()-0.5)*BUILD_W*0.9;
    cz = (gz-half)*BLOCK + BLOCK/2 + (rand()-0.5)*BUILD_W*0.9;
    attempts++;
  } while(circleHitsAnyObstacle(cx, cz, 0.5) && attempts < 25);
  spawnPed(cx, cz);
}

function updateNpcPed(p, dt){
  if(!p.alive) return;

  if(p.state === 'downed'){
    p.stateTimer -= dt;
    if(p.stateTimer <= 0){
      p.state = 'flee';
      p.stateTimer = 3;
      p.obj.rotation.x = 0; // back on their feet
    }
    return; // stunned — no movement or threat checks while down
  }

  // ---- threat detection: flee from fast car OR from player on foot if they just punched nearby ----
  let fleeX = 0, fleeZ = 0, shouldFlee = false;

  if(mode === 'car'){
    const dx = p.obj.position.x - car.obj.position.x;
    const dz = p.obj.position.z - car.obj.position.z;
    if(dx*dx + dz*dz < 100 && Math.abs(car.speed) > 4){
      fleeX = dx; fleeZ = dz; shouldFlee = true;
    }
  } else {
    // flee if player is very close on foot (saw the punch)
    const dx = p.obj.position.x - playerPed.position.x;
    const dz = p.obj.position.z - playerPed.position.z;
    if(dx*dx + dz*dz < 16 && ped.punching){
      fleeX = dx; fleeZ = dz; shouldFlee = true;
    }
  }

  if(shouldFlee){
    p.state = 'flee';
    p.stateTimer = 4; // stay fleeing for at least 4s after threat clears
    p.targetHeading = Math.atan2(fleeX, fleeZ);
  } else if(p.state === 'flee'){
    p.stateTimer -= dt;
    if(p.stateTimer <= 0) p.state = 'wander';
  }

  // ---- wander / idle state machine ----
  if(p.state !== 'flee'){
    p.stateTimer -= dt;
    if(p.stateTimer <= 0){
      if(p.state === 'wander'){
        // chance to stop and idle briefly
        if(rand() < 0.3){
          p.state = 'idle';
          p.stateTimer = 1.5 + rand()*2.5;
        } else {
          // pick a new target heading — large random swing so paths feel purposeful
          p.targetHeading += (rand()-0.5) * Math.PI * 1.2;
          p.stateTimer = 3 + rand()*4;
        }
      } else {
        p.state = 'wander';
        p.stateTimer = 3 + rand()*4;
      }
    }
  }

  // ---- separation: gently push away from nearby peds so they don't stack ----
  let sepX = 0, sepZ = 0;
  npcPeds.forEach(other=>{
    if(other === p || !other.alive) return;
    const sdx = p.obj.position.x - other.obj.position.x;
    const sdz = p.obj.position.z - other.obj.position.z;
    const sd2 = sdx*sdx + sdz*sdz;
    if(sd2 < 1.5 && sd2 > 0.001){
      const inv = 1/Math.sqrt(sd2);
      sepX += sdx*inv; sepZ += sdz*inv;
    }
  });
  if(sepX !== 0 || sepZ !== 0){
    p.targetHeading = Math.atan2(sepX, sepZ);
  }

  // ---- smooth heading interpolation (turn toward targetHeading) ----
  let hdiff = p.targetHeading - p.heading;
  while(hdiff >  Math.PI) hdiff -= Math.PI*2;
  while(hdiff < -Math.PI) hdiff += Math.PI*2;
  const turnRate = p.state === 'flee' ? 6 : 3;
  p.heading += THREE.MathUtils.clamp(hdiff, -turnRate*dt, turnRate*dt);

  // ---- speed ----
  const targetSpeed = p.state === 'idle' ? 0 : p.state === 'flee' ? p.maxSpeed*2.0 : p.maxSpeed*0.45;
  p.speed = THREE.MathUtils.lerp(p.speed, targetSpeed, dt * (p.state === 'flee' ? 8 : 4));

  // ---- movement + wall response ----
  const nx = p.obj.position.x + Math.sin(p.heading)*p.speed*dt;
  const nz = p.obj.position.z + Math.cos(p.heading)*p.speed*dt;
  if(!circleHitsAnyObstacle(nx, nz, p.radius)){
    p.obj.position.x = nx;
    p.obj.position.z = nz;
  } else {
    // wall hit: turn 90° and try sliding along it instead of just stopping
    p.targetHeading += Math.PI * 0.5 * (rand() > 0.5 ? 1 : -1);
    p.stateTimer = 0;
  }

  // city bounds
  const cityHalf = CITY_SIZE*BLOCK/2 - 5;
  if(Math.abs(p.obj.position.x) > cityHalf || Math.abs(p.obj.position.z) > cityHalf){
    p.targetHeading = Math.atan2(-p.obj.position.x, -p.obj.position.z);
  }

  // ---- visuals ----
  p.obj.rotation.y = p.heading;
  if(p.state !== 'idle' && p.speed > 0.3){
    p.walkCycle += dt * (p.state === 'flee' ? 14 : 8);
    const swing = Math.sin(p.walkCycle) * Math.min(0.6, p.speed*0.15);
    p.obj.userData.legL.rotation.x =  swing;
    p.obj.userData.legR.rotation.x = -swing;
    if(p.obj.userData.armL) p.obj.userData.armL.rotation.x = -swing*0.6;
    if(p.obj.userData.armR) p.obj.userData.armR.rotation.x =  swing*0.6;
  } else {
    p.obj.userData.legL.rotation.x = THREE.MathUtils.lerp(p.obj.userData.legL.rotation.x, 0, dt*6);
    p.obj.userData.legR.rotation.x = THREE.MathUtils.lerp(p.obj.userData.legR.rotation.x, 0, dt*6);
  }
}

// =========================================================
// TRAFFIC CARS — proper road following: only turn at intersections,
// stay on roads, slow for turns, brake when player is ahead
// =========================================================
const trafficCars = [];
const parkedCars = []; // vehicles abandoned by the player after stealing a different one — still solid, still stealable
const NUM_TRAFFIC = 10;
const trafficColors = [0x3366aa, 0xaaaa33, 0x33aaaa, 0x886633, 0x777777, 0xaa5533, 0x558833];

// Road graph: each intersection connects to its N/S/E/W neighbours (grid structure)
// Waypoint index: row * (CITY_SIZE+1) + col
function wpIdx(row, col){
  return row*(CITY_SIZE+1) + col;
}
function wpNeighbours(idx){
  const row = Math.floor(idx/(CITY_SIZE+1));
  const col = idx%(CITY_SIZE+1);
  const n = [];
  if(row > 0)          n.push(wpIdx(row-1, col));
  if(row < CITY_SIZE)  n.push(wpIdx(row+1, col));
  if(col > 0)          n.push(wpIdx(row, col-1));
  if(col < CITY_SIZE)  n.push(wpIdx(row, col+1));
  return n;
}

// waypoints: the road grid intersections, since roads only run along grid lines
const waypoints = [];
for(let i=0;i<=CITY_SIZE;i++){
  for(let j=0;j<=CITY_SIZE;j++){
    waypoints.push(new THREE.Vector3((i-half)*BLOCK, 0, (j-half)*BLOCK));
  }
}

function nearestWaypointIndex(pos){
  let best = 0, bestDist = Infinity;
  waypoints.forEach((w,i)=>{
    const d = w.distanceToSquared(pos);
    if(d < bestDist){ bestDist = d; best = i; }
  });
  return best;
}

function spawnTrafficCar(){
  const startIdx = Math.floor(rand()*waypoints.length);
  const neighbours = wpNeighbours(startIdx);
  const nextIdx = neighbours[Math.floor(rand()*neighbours.length)];
  const wp = waypoints[startIdx];
  const tc = buildCar(trafficColors[Math.floor(rand()*trafficColors.length)]);
  tc.position.set(wp.x, 0, wp.z);
  // face the direction of travel right from spawn so there's no initial spin
  const nextWp = waypoints[nextIdx];
  const spawnHeading = Math.atan2(nextWp.x - wp.x, nextWp.z - wp.z);
  scene.add(tc);
  trafficCars.push({
    obj: tc,
    heading: spawnHeading,
    speed: 0,
    maxSpeed: 12 + rand()*6,
    prevWaypoint: startIdx,
    targetWaypoint: nextIdx,
    alive: true,
    stuckTimer: 0,
    brakeTimer: 0,   // how long we've been braking (for player avoidance)
    pushVX: 0, pushVZ: 0, // knockback velocity from being rammed by the player
  });
}

for(let i=0;i<NUM_TRAFFIC;i++) spawnTrafficCar();

function updateTrafficCar(t, dt){
  if(!t.alive) return;
  applyPush(t, dt);

  const target = waypoints[t.targetWaypoint];
  const dx = target.x - t.obj.position.x;
  const dz = target.z - t.obj.position.z;
  const dist = Math.sqrt(dx*dx + dz*dz);

  // reached waypoint — pick next road-connected neighbour, preferring to continue straight
  if(dist < 2.5){
    t.prevWaypoint = t.targetWaypoint;
    const neighbours = wpNeighbours(t.targetWaypoint).filter(n => n !== t.prevWaypoint);
    if(neighbours.length === 0){
      // dead end — reverse (this shouldn't happen on a full grid but guard anyway)
      t.targetWaypoint = t.prevWaypoint;
    } else {
      // bias: 55% chance to continue in same direction if possible, else random turn
      const currDx = waypoints[t.targetWaypoint].x - waypoints[t.prevWaypoint].x;
      const currDz = waypoints[t.targetWaypoint].z - waypoints[t.prevWaypoint].z;
      const straight = neighbours.filter(n=>{
        const nd = waypoints[n];
        const cx = nd.x - waypoints[t.targetWaypoint].x;
        const cz = nd.z - waypoints[t.targetWaypoint].z;
        return Math.sign(cx) === Math.sign(currDx) && Math.sign(cz) === Math.sign(currDz);
      });
      if(straight.length > 0 && rand() < 0.55){
        t.targetWaypoint = straight[0];
      } else {
        t.targetWaypoint = neighbours[Math.floor(rand()*neighbours.length)];
      }
    }
    return;
  }

  // smooth heading toward waypoint
  const desiredHeading = Math.atan2(dx, dz);
  let diff = desiredHeading - t.heading;
  while(diff >  Math.PI) diff -= Math.PI*2;
  while(diff < -Math.PI) diff += Math.PI*2;
  // slow down proportionally to how sharp the turn is
  const turnSharpness = Math.abs(diff) / Math.PI; // 0=straight, 1=U-turn
  t.heading += THREE.MathUtils.clamp(diff, -3*dt, 3*dt);

  // brake check: player car directly ahead within braking distance
  let braking = false;
  if(mode === 'car'){
    const pdx = car.obj.position.x - t.obj.position.x;
    const pdz = car.obj.position.z - t.obj.position.z;
    const pDist = Math.sqrt(pdx*pdx + pdz*pdz);
    const angleToPlayer = Math.atan2(pdx, pdz);
    let angleDiff = angleToPlayer - t.heading;
    while(angleDiff >  Math.PI) angleDiff -= Math.PI*2;
    while(angleDiff < -Math.PI) angleDiff += Math.PI*2;
    if(pDist < 12 && Math.abs(angleDiff) < 0.5){
      braking = true;
    }
  }

  const targetSpeed = braking ? 0 : t.maxSpeed * (1 - turnSharpness*0.7);
  t.speed = THREE.MathUtils.lerp(t.speed, targetSpeed, dt * (braking ? 6 : 2));
  t.speed = Math.max(0, t.speed);

  const moveDist = t.speed*dt;
  const nx = t.obj.position.x + Math.sin(t.heading)*moveDist;
  const nz = t.obj.position.z + Math.cos(t.heading)*moveDist;

  if(!circleHitsAnyObstacle(nx, nz, 1.6)){
    t.obj.position.x = nx;
    t.obj.position.z = nz;
    t.stuckTimer = 0;
  } else {
    t.stuckTimer += dt;
    if(t.stuckTimer > 2){
      // genuinely stuck — jump to nearest waypoint and retarget
      const nearest = nearestWaypointIndex(t.obj.position);
      t.obj.position.copy(waypoints[nearest]);
      t.prevWaypoint = nearest;
      const nb = wpNeighbours(nearest);
      t.targetWaypoint = nb[Math.floor(rand()*nb.length)];
      t.stuckTimer = 0;
    }
  }

  t.obj.rotation.y = t.heading;
  t.obj.userData.wheels.forEach(w=>{ w.rotation.x += t.speed*dt*2; });
}

// WANTED SYSTEM (validated state machine, ported from testharness/wanted_test.js)
// =========================================================
const wanted = {
  level: 0,
  maxLevel: 5,
  timeSinceSeenByCop: 0,
  evadeTimeNeeded: 12,
};
let bustFlashTimer = 0; // declared early: referenced inside updateCops() below, kept near other wanted-system state for clarity

function commitCrime(severity){
  wanted.level = Math.min(wanted.maxLevel, wanted.level + severity);
  wanted.timeSinceSeenByCop = 0;
}

// 50% chance to add 1 star — used for soft crimes (hitting cars, punching civilians)
function maybeCrime(){
  if(Math.random() < 0.5) commitCrime(1);
}

function copsToSpawn(level){
  if(level === 0) return 0;
  if(level <= 2) return 1;
  if(level <= 4) return 2;
  return 3;
}

function tickWanted(dt, copsCanSeePlayer){
  if(copsCanSeePlayer){
    wanted.timeSinceSeenByCop = 0;
  } else {
    wanted.timeSinceSeenByCop += dt;
  }
  if(wanted.level > 0 && wanted.timeSinceSeenByCop >= wanted.evadeTimeNeeded - 1e-6){
    wanted.level = Math.max(0, wanted.level - 1);
    wanted.timeSinceSeenByCop = 0;
  }
}

// ---------- COP CARS ----------
const copCars = [];

function spawnCop(){
  const playerPos = mode === 'car' ? car.obj.position : ped.obj.position;
  // spawn at a random point ~40-60 units away from the player, snapped toward nearest road waypoint
  const angle = (window.GXV && wanted.level>=4 && GXV.s>12) ? Math.atan2(GXV.x,GXV.z)+(rand()-0.5)*0.8 : rand()*Math.PI*2;
  const dist = 55 + rand()*25;
  const roughX = playerPos.x + Math.sin(angle)*dist;
  const roughZ = playerPos.z + Math.cos(angle)*dist;
  const wpIdx = nearestWaypointIndex(new THREE.Vector3(roughX,0,roughZ));
  const wp = waypoints[wpIdx];

  const cop = buildCar(0x1144cc);
  // light bar (cheap visual distinguishing cops from traffic)
  const bar = new THREE.Mesh(new THREE.BoxGeometry(0.6,0.25,0.3), new THREE.MeshBasicMaterial({color:0xff2222}));
  bar.position.set(0, 1.85, -0.2);
  cop.add(bar);
  cop.position.set(wp.x, 0, wp.z);
  scene.add(cop);

  copCars.push({
    obj: cop,
    heading: 0,
    speed: 0,
    maxSpeed: 34,
    accel: 26,
    alive: true,
    bustTimer: 0,
    onFoot: false,      // true once the cop exits their car
    copPed: null,       // THREE.Group ped model, created on exit
    copHp: 3,           // cop takes 3 punches to down
    copPunchTimer: 0,   // cooldown between cop punches
    copWalkCycle: 0,
    pushVX: 0, pushVZ: 0, // knockback velocity from being rammed by the player
  });
}

function despawnAllCops(){
  copCars.forEach(c=>{
    scene.remove(c.obj);
    if(c.copPed) scene.remove(c.copPed);
    c.alive = false;
  });
  copCars.length = 0;
}

let copSpawnCooldown = 0;
let copsCanSeePlayerThisFrame = false;

// Returns the best next waypoint index for a cop at `fromPos` trying to reach `toPos`.
// Uses greedy best-first on the road graph: picks the neighbour of the nearest
// waypoint to `fromPos` that is closest to the nearest waypoint to `toPos`.
// This gives smooth road-following without full BFS on a regular grid.
function copNextWaypointTarget(fromPos, toPos){
  const fromIdx  = nearestWaypointIndex(fromPos);
  const toIdx    = nearestWaypointIndex(toPos);
  if(fromIdx === toIdx) return toPos; // already at destination waypoint — go direct

  const neighbours = wpNeighbours(fromIdx);
  let bestIdx = neighbours[0], bestDist = Infinity;
  const goal = waypoints[toIdx];
  neighbours.forEach(ni=>{
    const w = waypoints[ni];
    const d = (w.x-goal.x)**2 + (w.z-goal.z)**2;
    if(d < bestDist){ bestDist = d; bestIdx = ni; }
  });
  return waypoints[bestIdx];
}

function updateCops(dt){
  const desiredCount = copsToSpawn(wanted.level);
  const aliveCops = copCars.filter(c=>c.alive);

  copSpawnCooldown -= dt;
  if(aliveCops.length < desiredCount && copSpawnCooldown <= 0){
    spawnCop();
    copSpawnCooldown = 1.5;
  }
  if(desiredCount === 0 && aliveCops.length > 0){
    despawnAllCops();
    return;
  }

  copsCanSeePlayerThisFrame = false;
  const playerPos = mode === 'car' ? car.obj.position : ped.obj.position;

  const chaseSpeedMult = (0.78 + wanted.level * 0.1) * (window.GXD?GXD.cop:1);

  copCars.forEach((c, ci)=>{
    if(!c.alive) return;
    applyPush(c, dt);

    const copPos = c.onFoot ? c.copPed.position : c.obj.position;
    const dx = playerPos.x - copPos.x;
    const dz = playerPos.z - copPos.z;
    const dist = Math.sqrt(dx*dx + dz*dz);

    if(dist < 45 || (dist < 110 && copLOS(copPos, playerPos))){ copsCanSeePlayerThisFrame = true; COPAI.seen = 0; COPAI.last.copy(playerPos); }

    const flankAngle = (ci / Math.max(1, aliveCops.length)) * Math.PI * 0.6 - Math.PI*0.3;
    const flankTarget = {
      x: playerPos.x + Math.sin(flankAngle) * 1.5 + (window.GXV ? GXV.x*Math.min(1.3,dist/28) : 0),
      z: playerPos.z + Math.cos(flankAngle) * 1.5 + (window.GXV ? GXV.z*Math.min(1.3,dist/28) : 0),
    };

    if(!c.onFoot){
      // ---- DRIVING MODE — road-graph pathfinding ----
      const chaseMaxSpeed = c.maxSpeed * chaseSpeedMult * Math.min(1.4, Math.max(1, dist/50));

      // Use waypoint graph to navigate; only go direct when very close to the player
      // (within one block width) so cops don't beeline through buildings
      let navTarget;
      if(dist < BLOCK * 1.1 && copLOS(c.obj.position, playerPos)){
        // close enough that direct path is likely clear, aim straight at player
        navTarget = flankTarget;
      } else {
        // path through road graph
        const wp = copNextWaypointTarget(c.obj.position, copGoal(c, ci));
        navTarget = { x: wp.x, z: wp.z };
      }

      const cdx = navTarget.x - c.obj.position.x;
      const cdz = navTarget.z - c.obj.position.z;
      const desiredHeading = Math.atan2(cdx, cdz);
      let diff = desiredHeading - c.heading;
      while(diff >  Math.PI) diff -= Math.PI*2;
      while(diff < -Math.PI) diff += Math.PI*2;
      const turnCap = THREE.MathUtils.lerp(4, 1.5, c.speed/chaseMaxSpeed) * dt;
      c.heading += THREE.MathUtils.clamp(diff, -turnCap, turnCap);

      const sharpness = Math.abs(diff)/Math.PI;
      const speedTarget = chaseMaxSpeed * (1 - sharpness*0.55);
      c.speed = THREE.MathUtils.lerp(c.speed, speedTarget, dt*1.5);

      const moveDist = c.speed * dt;
      const nx = c.obj.position.x + Math.sin(c.heading)*moveDist;
      const nz = c.obj.position.z + Math.cos(c.heading)*moveDist;

      // try full move, then axis-separated slide, to reduce corner-catching
      if(!circleHitsAnyObstacle(nx, nz, 1.6)){
        c.obj.position.x = nx;
        c.obj.position.z = nz;
        c._stuckTimer = 0;
      } else if(!circleHitsAnyObstacle(nx, c.obj.position.z, 1.6)){
        c.obj.position.x = nx;
        c._stuckTimer = 0;
      } else if(!circleHitsAnyObstacle(c.obj.position.x, nz, 1.6)){
        c.obj.position.z = nz;
        c._stuckTimer = 0;
      } else {
        // fully stuck — snap to nearest road waypoint
        if(!c._stuckTimer) c._stuckTimer = 0;
        c._stuckTimer += dt;
        if(c._stuckTimer > 0.8){
          const wp = waypoints[nearestWaypointIndex(c.obj.position)];
          c.obj.position.set(wp.x, 0, wp.z);
          c._stuckTimer = 0;
        }
      }

      c.obj.rotation.y = c.heading;
      c.obj.userData.wheels.forEach(w=>{ w.rotation.x += c.speed*dt*2; });

      // exit car when close to on-foot player
      if(mode === 'foot' && dist < 7){
        c.onFoot = true;
        c.obj.visible = false;
        c.speed = 0;
        c.copPed = buildPed(0x1144cc);
        c.copPed.position.set(c.obj.position.x + 1.5, 0, c.obj.position.z);
        scene.add(c.copPed);
      }

      // car-to-car ram damage — ramming a cop car always adds 2 stars
      if(mode === 'car' && dist < 3.2){
        commitCrime(2);
        const impact = Math.min(1, Math.abs(car.speed)/car.maxSpeed);
        damagePlayer(8 + impact*14);
      }

    } else {
      // ---- ON-FOOT MODE ----
      if(mode === 'car'){
        c.onFoot = false;
        c.obj.visible = true;
        scene.remove(c.copPed);
        c.copPed = null;
        return;
      }

      const cdx = flankTarget.x - c.copPed.position.x;
      const cdz = flankTarget.z - c.copPed.position.z;
      const desiredHeading = Math.atan2(cdx, cdz);
      let diff = desiredHeading - c.heading;
      while(diff >  Math.PI) diff -= Math.PI*2;
      while(diff < -Math.PI) diff += Math.PI*2;
      c.heading += THREE.MathUtils.clamp(diff, -6*dt, 6*dt);

      const footSpeed = (5 + wanted.level*0.4) * chaseSpeedMult;
      const mnx = c.copPed.position.x + Math.sin(c.heading)*footSpeed*dt;
      const mnz = c.copPed.position.z + Math.cos(c.heading)*footSpeed*dt;

      if(!circleHitsAnyObstacle(mnx, mnz, 0.35)){
        c.copPed.position.x = mnx;
        c.copPed.position.z = mnz;
      } else if(!circleHitsAnyObstacle(mnx, c.copPed.position.z, 0.35)){
        c.copPed.position.x = mnx;
      } else if(!circleHitsAnyObstacle(c.copPed.position.x, mnz, 0.35)){
        c.copPed.position.z = mnz;
      } else {
        const wp = waypoints[nearestWaypointIndex(c.copPed.position)];
        c.heading = Math.atan2(wp.x - c.copPed.position.x, wp.z - c.copPed.position.z);
      }

      c.copPed.rotation.y = c.heading;
      c.copWalkCycle += dt*10;
      const swing = Math.sin(c.copWalkCycle)*0.5;
      if(c.copPed.userData.legL) c.copPed.userData.legL.rotation.x =  swing;
      if(c.copPed.userData.legR) c.copPed.userData.legR.rotation.x = -swing;

      c.copPunchTimer = Math.max(0, c.copPunchTimer - dt);
      if(dist < 1.8 && c.copPunchTimer <= 0){
        damagePlayer(12);
        c.copPunchTimer = 0.9;
        if(c.copPed.userData.armR) c.copPed.userData.armR.rotation.x = -1.2;
      } else {
        if(c.copPed.userData.armR){
          c.copPed.userData.armR.rotation.x = THREE.MathUtils.lerp(
            c.copPed.userData.armR.rotation.x, 0, dt*8);
        }
      }

      if(dist < 1.4){
        c.bustTimer += dt;
        if(c.bustTimer > 2.0){
          wanted.level = 0;
          despawnAllCops();
          bustFlashTimer = 1.5;
          return;
        }
      } else {
        c.bustTimer = Math.max(0, c.bustTimer - dt);
      }
    }
  });
}

// CRIME DETECTION — hitting peds/traffic with the player's car

function checkCarCrimes(dt){
  if(mode !== 'car') return;
  if(Math.abs(car.speed) < 5) return; // gentle bumps don't count

  npcPeds.forEach(p=>{
    if(!p.alive) return;
    const dx = p.obj.position.x - car.obj.position.x;
    const dz = p.obj.position.z - car.obj.position.z;
    if(dx*dx+dz*dz < 3.5){
      p.alive = false;
      scene.remove(p.obj);
      maybeCrime(); // 50% chance: running over a ped
    }
  });

  trafficCars.forEach(t=>{
    if(!t.alive) return;
    const dx = t.obj.position.x - car.obj.position.x;
    const dz = t.obj.position.z - car.obj.position.z;
    if(dx*dx+dz*dz < 5 && Math.abs(car.speed) > 12){
      maybeCrime(); // 50% chance: hard ram on a traffic car
      t.targetWaypoint = Math.floor(rand()*waypoints.length);
    }
  });
}

const health = { hp: 100, maxHp: 100, alive: true, invulnTimer: 0 };

function damagePlayer(amount){
  if(!health.alive || health.invulnTimer > 0) return;
  health.hp = Math.max(0, health.hp - amount);
  health.invulnTimer = 0.5;
  if(health.hp <= 0) health.alive = false;
}

function tickHealth(dt){
  if(health.invulnTimer > 0) health.invulnTimer = Math.max(0, health.invulnTimer - dt);
  // slow natural regen so a single bad hit isn't permanently crippling, but
  // it's slow enough that sustained combat/chase damage still threatens death
  if(health.alive && health.hp < health.maxHp && health.invulnTimer <= 0){
    health.hp = Math.min(health.maxHp, health.hp + 1.5*dt);
  }
}

function respawnPlayer(){
  health.hp = health.maxHp;
  health.alive = true;
  health.invulnTimer = 1.5;
  wanted.level = 0;
  despawnAllCops();
  // respawn near mission start area rather than wherever the player died,
  // matching classic GTA "wake up at the hospital" behavior
  const spawn = waypoints[nearestWaypointIndex(new THREE.Vector3(0,0,20))];
  if(mode === 'car'){
    car.obj.position.set(spawn.x, 0, spawn.z);
    car.speed = 0;
  } else {
    ped.obj.position.set(spawn.x, 0, spawn.z);
    ped.speed = 0;
  }
}

const missionSys = {
  defs: missionDefs,
  currentIndex: -1,
  state: 'idle', // 'idle' | 'active' | 'complete' | 'failed'
  objectiveProgress: new Set(),
  timer: null,
  failReason: null,
  triggeredEscapeAmbush: false, // mission 3 specific: has the ambush fired yet
};

function startMission(index){
  missionSys.currentIndex = index;
  missionSys.state = 'active';
  missionSys.objectiveProgress = new Set();
  const def = missionSys.defs[index];
  missionSys.timer = def.timeLimit || null;
  missionSys.failReason = null;
  missionSys.triggeredEscapeAmbush = false;
  showMissionBanner(def.introText, 5);
  refreshMissionMarkers();
}

function dist2(ax,az,bx,bz){ const dx=ax-bx, dz=az-bz; return dx*dx+dz*dz; }

function tickMission(dt){
  if(missionSys.state !== 'active') return;
  const def = missionSys.defs[missionSys.currentIndex];
  const playerPos = mode === 'car' ? car.obj.position : ped.obj.position;

  if(missionSys.timer !== null){
    missionSys.timer -= dt;
    if(missionSys.timer <= 0){
      missionSys.state = 'failed';
      missionSys.failReason = 'timeout';
      showMissionBanner('Mission failed: out of time.', 4);
      return;
    }
  }

  if(!health.alive){
    missionSys.state = 'failed';
    missionSys.failReason = 'wasted';
    showMissionBanner('Mission failed: wasted.', 4);
    return;
  }

  def.objectives.forEach(obj=>{
    if(missionSys.objectiveProgress.has(obj.id)) return;

    if(obj.type === 'reach'){
      if(dist2(playerPos.x, playerPos.z, obj.x, obj.z) < obj.radius*obj.radius){
        missionSys.objectiveProgress.add(obj.id);
        refreshMissionMarkers();
      }
    } else if(obj.type === 'wanted_clear_after_trigger'){
      // the ambush fires once reachDocks completes (handled below); from then on,
      // this objective completes when wanted drops back to 0 (player evaded)
      if(missionSys.triggeredEscapeAmbush && wanted.level === 0){
        missionSys.objectiveProgress.add(obj.id);
      }
    } else if(obj.type === 'catch_target'){
      if(targetCar && targetCar.caught){
        missionSys.objectiveProgress.add(obj.id);
      } else if(targetCar && targetCar.reachedHarbor){
        missionSys.state = 'failed';
        missionSys.failReason = 'target_escaped';
        showMissionBanner('Mission failed: Marko got away.', 4);
        return;
      }
    }
  });

  // mission 3 specific trigger: once the player reaches the docks, spring the ambush
  if(missionSys.currentIndex === 2 && missionSys.objectiveProgress.has('reachDocks') && !missionSys.triggeredEscapeAmbush){
    missionSys.triggeredEscapeAmbush = true;
    commitCrime(3); // instantly puts the player at 3 stars — the "setup"
    showMissionBanner("It's an ambush! Lose the cops!", 4);
  }

  // mission 4 specific: spawn/update the chase target the first time this mission ticks
  if(missionSys.currentIndex === 3 && !targetCar){
    spawnTargetCar();
  }

  const allDone = def.objectives.every(obj=>missionSys.objectiveProgress.has(obj.id));
  if(allDone){
    missionSys.state = 'complete';
    showMissionBanner(def.completeText, 5);
  }
}

function advanceToNextMissionIfReady(){
  if(missionSys.state === 'complete'){
    let next = missionSys.currentIndex + 1;
    if(window.CH2X !== undefined){
      if(missionSys.currentIndex === 6) next = window.CH2X;
      else if(missionSys.currentIndex === window.CH2X) next = 7;
      else if(missionSys.currentIndex === 9) next = 1e9;
    }
    if(next < missionDefs.length){
      setTimeout(()=>startMission(next), next===1?800:3500); // brief pause so the complete banner is readable (short after Lou's so Marko's scene starts right away)
      missionSys.state = 'transitioning';
    } else {
      missionSys.state = 'finished';
      showMissionBanner('All missions complete. You own this town now.', 6);
    }
  } else if(missionSys.state === 'failed'){
    setTimeout(()=>startMission(missionSys.currentIndex), 3500);
    missionSys.state = 'transitioning';
  }
}

const harborPoint = new THREE.Vector3(160, 0, 160);

function spawnTargetCar(){
  const obj = buildMotorcycle(0x222222, 0x3a3a3a);
  // red helmet marker so the player can pick Marko out from traffic — same
  // color/purpose as the old car-roof panel, just repositioned onto the
