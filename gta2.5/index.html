    pushVX: 0, pushVZ: 0,
    stallTimer: 0,
    stuckTimer: 0,
    evadeUntil: 0,   // world time: stay on evasion route until this time
    evadeWp: -1,     // waypoint to evade toward
  };
}

// simple BFS to find next waypoint toward goal on the road graph
// returns the neighbour of fromIdx that's on the shortest path to toIdx
function bfsNextWp(fromIdx, toIdx){
  if(fromIdx === toIdx) return toIdx;
  // BFS on the small grid (max 81 nodes) — fast enough to run occasionally
  const prev = new Int32Array(waypoints.length).fill(-1);
  const visited = new Uint8Array(waypoints.length);
  const queue = [toIdx]; // BFS from goal backwards so we can trace forward easily
  visited[toIdx] = 1;
  while(queue.length){
    const cur = queue.shift();
    for(const nb of wpNeighbours(cur)){
      if(!visited[nb]){ visited[nb]=1; prev[nb]=cur; queue.push(nb); }
    }
  }
  // trace path from fromIdx forward using the BFS parent chain we just built.
  // prev[] points from each node back toward toIdx (BFS ran from the goal),
  // so walking prev from fromIdx retraces the true shortest hop-count path —
  // this is what actually avoids buildings, since wpNeighbours only connects
  // to real road-grid neighbours in the first place.
  if(prev[fromIdx] === -1) return wpNeighbours(fromIdx)[0]; // fromIdx unreachable/isolated, fallback
  return prev[fromIdx];
}

function updateTargetCar(dt){
  if(!targetCar || targetCar.caught || targetCar.reachedHarbor) return;
  applyPush(targetCar, dt);

  // wall/tree clearance radius sized to the motorcycle's actual visible
  // footprint (front wheel edge ~1.42 from center along the long axis, plus
  // a small margin) rather than the car body's 1.6, which left an invisible
  // buffer of over a unit beyond the visible bike on the sides — hoisted
  // here so both the evasion-detour obstacle check below and the movement
  // collision check further down use the same value.
  const MARKO_WALL_R = 1.53;

  markoHitCheck();
  if(targetCar.caught) return;
  if(targetCar.stallTimer > 0){
    targetCar.stallTimer -= dt;
    targetCar.speed = THREE.MathUtils.lerp(targetCar.speed, 0, dt*5);
    targetCar.obj.rotation.y = targetCar.heading;
    return;
  }

  const pos = targetCar.obj.position;
  if(pos.distanceTo(harborPoint) < 6){ targetCar.reachedHarbor = true; return; }

  // player proximity
  const playerPos = mode === 'car' ? car.obj.position : ped.obj.position;
  const pdx = pos.x - playerPos.x;
  const pdz = pos.z - playerPos.z;
  const playerDist = Math.sqrt(pdx*pdx + pdz*pdz);

  // panic speed ramps as player closes in
  const panicT = THREE.MathUtils.clamp(1 - playerDist/45, 0, 1);
  targetCar.maxSpeed = THREE.MathUtils.lerp(targetCar.baseSpeed, targetCar.panicSpeed, panicT);

  // choose nav target waypoint
  const now = performance.now() / 1000;
  const myWp = nearestWaypointIndex(pos);
  let navWpIdx;

  if(targetCar.evadeUntil > now && targetCar.evadeWp >= 0){
    // currently evading — head toward the detour waypoint
    navWpIdx = targetCar.evadeWp;
    // if we reached the detour waypoint, resume normal routing
    if(myWp === targetCar.evadeWp) targetCar.evadeUntil = 0;
  } else {
    // normal: pick best next waypoint toward harbor using BFS
    navWpIdx = bfsNextWp(myWp, nearestWaypointIndex(harborPoint));

    // evasion trigger: player is very close and behind Marko
    if(playerDist < 18 && targetCar.evadeUntil <= now){
      // pick a perpendicular neighbour — the one most orthogonal to player direction
      const toPlayerX = -pdx, toPlayerZ = -pdz; // vector FROM marko TO player (normalized below)
      const pLen = Math.sqrt(toPlayerX*toPlayerX + toPlayerZ*toPlayerZ) || 1;
      let bestScore = -Infinity, bestEv = -1;
      for(const nb of wpNeighbours(myWp)){
        const wp = waypoints[nb];
        // skip candidates that are actually blocked — this scorer picks purely
        // on angle/harbor-progress with no obstacle check of its own, unlike
        // bfsNextWp above (which inherits obstacle-avoidance only incidentally,
        // by virtue of shortest-hop paths on this grid usually staying on-road).
        // Without this, evasion could confidently aim Marko at a blocked
        // neighbour, and since evasion only overrides routing when the player
        // is close (playerDist < 18), the wall-stuck symptom only showed up
        // near the player — this is that gap.
        if(circleHitsAnyObstacle(wp.x, wp.z, MARKO_WALL_R)) continue;
        const toWpX = wp.x - pos.x, toWpZ = wp.z - pos.z;
        const wLen = Math.sqrt(toWpX*toWpX + toWpZ*toWpZ) || 1;
        // perpendicular score: low dot product = more sideways relative to player
        const dot = (toPlayerX/pLen)*(toWpX/wLen) + (toPlayerZ/pLen)*(toWpZ/wLen);
        // also prefer routes that still make harbor progress
        const harborDot = ((harborPoint.x-pos.x)*(toWpX/wLen) + (harborPoint.z-pos.z)*(toWpZ/wLen)) /
          (Math.sqrt((harborPoint.x-pos.x)**2+(harborPoint.z-pos.z)**2)||1);
        const score = -dot * 0.65 + harborDot * 0.35;
        if(score > bestScore){ bestScore = score; bestEv = nb; }
      }
      // bestEv stays -1 if every neighbour was blocked (rare, tight geometry) —
      // navWpIdx below just keeps whatever bfsNextWp already picked, which is
      // a safe fallback since that path is at least graph-valid.
      if(bestEv >= 0 && bestEv !== navWpIdx){
        targetCar.evadeWp   = bestEv;
        targetCar.evadeUntil = now + 3.0;
        navWpIdx = bestEv;
      }
    }
  }

  // steer toward chosen waypoint
  const navWp = waypoints[navWpIdx];
  const tdx = navWp.x - pos.x;
  const tdz = navWp.z - pos.z;
  const toWpDist = Math.sqrt(tdx*tdx + tdz*tdz);

  const desiredHeading = Math.atan2(tdx, tdz);
  let diff = desiredHeading - targetCar.heading;
  while(diff >  Math.PI) diff -= Math.PI*2;
  while(diff < -Math.PI) diff += Math.PI*2;
  targetCar.heading += THREE.MathUtils.clamp(diff, -3*dt, 3*dt);

  const sharpness = Math.abs(diff)/Math.PI;
  const targetSpeed = targetCar.maxSpeed * (1 - sharpness*0.5);
  targetCar.speed = THREE.MathUtils.lerp(targetCar.speed, targetSpeed, dt*1.8);

  const moveDist = targetCar.speed * dt;
  const nx = pos.x + Math.sin(targetCar.heading)*moveDist;
  const nz = pos.z + Math.cos(targetCar.heading)*moveDist;

  if(!circleHitsAnyObstacle(nx, nz, MARKO_WALL_R)){
    pos.x = nx; pos.z = nz;
    targetCar.stuckTimer = 0;
  } else if(!circleHitsAnyObstacle(nx, pos.z, MARKO_WALL_R)){
    pos.x = nx; targetCar.speed *= 0.5; targetCar.stuckTimer = 0;
  } else if(!circleHitsAnyObstacle(pos.x, nz, MARKO_WALL_R)){
    pos.z = nz; targetCar.speed *= 0.5; targetCar.stuckTimer = 0;
  } else {
    targetCar.stuckTimer += dt;
    if(targetCar.stuckTimer > 0.5){
      // snap to nearest clear waypoint and reset route
      const wp = waypoints[nearestWaypointIndex(pos)];
      pos.set(wp.x, 0, wp.z);
      targetCar.stuckTimer = 0;
      targetCar.evadeUntil = 0; // force route recalculation
      targetCar.speed *= 0.3;
    }
  }

  targetCar.obj.rotation.y = targetCar.heading;
  targetCar.obj.userData.wheels.forEach(w=>{ w.rotation.x += targetCar.speed*dt*2; });

  markoHitCheck();
}

// Hitting the bike at speed ends Marko. Car-vs-car resolution keeps the two
// hitboxes >= 3.2 apart, so the old "< 2 units" test could never fire; test
// at 3.6 (just outside contact) and run it every frame, including while he
// is stalled (the stall branch used to return before this was reached).
function markoHitCheck(){
  if(!targetCar || targetCar.caught || targetCar.reachedHarbor || mode !== 'car') return;
  const pos = targetCar.obj.position;
  const rdx = pos.x - car.obj.position.x;
  const rdz = pos.z - car.obj.position.z;
  const rDistSq = rdx*rdx + rdz*rdz;
  if(rDistSq < 13){
    const impactSpeed = Math.abs(car.speed);
    if(impactSpeed > 3) targetCar.stallTimer = 0.5 + impactSpeed*0.025;
    if(impactSpeed > 5){
      targetCar.caught = true;
      targetCar.crashPos = pos.clone();
      scene.remove(targetCar.obj);
    }
  }
}

// =========================================================
// CAR-VS-CAR HITBOXES — every car (player, traffic, cops, target) is
// treated as a circle of this radius; on overlap they're pushed apart.
// When the player is one of the two, the other car gets shoved away with
// real knockback velocity instead of just bouncing — that's how you push
// cars out of the way. Two AI cars colliding with each other still just
// bumper-bounce, since the player isn't involved.
// Buildings and trees are handled separately (circleHitsAnyObstacle) since
// they're immovable — they don't take part in this at all.
// =========================================================
const CAR_HITBOX_R = 1.6; // matches the circle radius already used for car-vs-building/tree checks

function getCarColliders(){
  const list = [car]; // the player's car — still a solid obstacle even parked while on foot
  trafficCars.forEach(t=>{ if(t.alive) list.push(t); });
  copCars.forEach(c=>{ if(c.alive) list.push(c); }); // cop car turns invisible once the cop gets out
  if(targetCar && !targetCar.caught) list.push(targetCar);
  parkedCars.forEach(p=> list.push(p)); // vehicles left behind after being stolen out from under someone
  return list;
}

// Applies any knockback velocity (from being rammed by the player) directly to
// a car's position, independent of its own AI-driven heading/speed — this is
// what lets a shoved car actually slide sideways instead of only ever moving
// along the direction it happens to be steering. Decays with simple drag.
function applyPush(t, dt){
  if(!t.pushVX && !t.pushVZ) return;
  t.obj.position.x += t.pushVX * dt;
  t.obj.position.z += t.pushVZ * dt;
  const decay = Math.max(0, 1 - 4*dt);
  t.pushVX *= decay;
  t.pushVZ *= decay;
  if(Math.abs(t.pushVX) < 0.05) t.pushVX = 0;
  if(Math.abs(t.pushVZ) < 0.05) t.pushVZ = 0;
}

function resolveCarCollisions(){
  const cars = getCarColliders();
  const minDist = CAR_HITBOX_R * 2;
  for(let i=0; i<cars.length; i++){
    for(let j=i+1; j<cars.length; j++){
      const a = cars[i], b = cars[j];
      const dx = b.obj.position.x - a.obj.position.x;
      const dz = b.obj.position.z - a.obj.position.z;
      const distSq = dx*dx + dz*dz;
      if(distSq >= minDist*minDist) continue;

      const dist = Math.sqrt(distSq);
      const nx = dist > 0.0001 ? dx/dist : 1;
      const nz = dist > 0.0001 ? dz/dist : 0;
      const overlap = minDist - dist;

      // push the two hitboxes apart so they no longer overlap — but never push
      // a car into a building or tree to do it. Without this check, a car
      // already pressed against an obstacle just gets shoved further into it
      // by every other car that piles up behind it, which is exactly what
      // caused cop cars to clip into trees during a chase.
      const aNewX = a.obj.position.x - nx * overlap * 0.5;
      const aNewZ = a.obj.position.z - nz * overlap * 0.5;
      const bNewX = b.obj.position.x + nx * overlap * 0.5;
      const bNewZ = b.obj.position.z + nz * overlap * 0.5;
      const aBlocked = circleHitsAnyObstacle(aNewX, aNewZ, CAR_HITBOX_R);
      const bBlocked = circleHitsAnyObstacle(bNewX, bNewZ, CAR_HITBOX_R);

      if(!aBlocked && !bBlocked){
        a.obj.position.x = aNewX; a.obj.position.z = aNewZ;
        b.obj.position.x = bNewX; b.obj.position.z = bNewZ;
      } else if(!aBlocked){
        // b can't move (obstacle behind it) — give a the whole separation instead
        a.obj.position.x -= nx * overlap;
        a.obj.position.z -= nz * overlap;
      } else if(!bBlocked){
        b.obj.position.x += nx * overlap;
        b.obj.position.z += nz * overlap;
      }
      // if both are blocked, they're wedged between obstacles — leave them
      // overlapped rather than clipping either one through a wall or tree

      const aIsPlayer = a === car;
      const bIsPlayer = b === car;

      if(aIsPlayer || bIsPlayer){
        // player vs an AI car — shove the other car away along the impact
        // normal (as real knockback velocity, not just a one-frame position
        // correction) so ramming it actually pushes it out of the way.
        const player = aIsPlayer ? a : b;
        const other  = aIsPlayer ? b : a;
        const dirSign = aIsPlayer ? 1 : -1; // normal points a->b; flip so it points player->other
        const impactSpeed = Math.abs(player.speed);
        const pushPower = impactSpeed * 0.85;
        other.pushVX = (other.pushVX || 0) + nx * dirSign * pushPower;
        other.pushVZ = (other.pushVZ || 0) + nz * dirSign * pushPower;

        // Only bleed the player's speed when they're actually driving INTO
        // the other car — otherwise this fired unconditionally on every
        // frame of contact, including while the player was pressing S to
        // back away from a wedge. That meant reversing out of a pileup was
        // fighting a 25%-per-frame speed cut that had nothing to do with
        // ramming, on top of whatever the pileup itself was doing — reading
        // as "I can't back up OR pull forward" even though escaping-forward
        // and escaping-backward are opposite velocity directions and only
        // one of them (driving further into the other car) should ever be
        // punished here. Position separation above already isn't
        // direction-gated like this, so pulling away was already free on
        // that front — this was the one place still blocking it.
        const playerVelX = Math.sin(player.heading) * player.speed;
        const playerVelZ = Math.cos(player.heading) * player.speed;
        const towardOther = (playerVelX * nx * dirSign) + (playerVelZ * nz * dirSign);
        if(towardOther > 0) player.speed *= 0.75;
      } else {
        // two AI cars colliding with each other. Previously this just flipped
        // each car's own `speed` scalar (a.speed = -a.speed*0.5), which only
        // affects next frame's movement along whatever heading each car
        // happens to be facing — it does nothing to actual position. When
        // position-separation above was blocked (one car already against a
        // building), the flip was the ONLY effect, so the car would reverse
        // into the same spot, re-overlap, flip again — visible as cars
        // twitching in place against each other, and as cops specifically
        // getting pinned against walls since flanking often puts several of
        // them in tight formation near obstacles.
        // Fix: give both cars a small mutual push impulse via the existing
        // pushVX/pushVZ knockback mechanism instead (already used for player
        // rams, and already obstacle-independent by design) so they drift
        // apart smoothly over the next few frames regardless of which way
        // either car is currently steering. Weaker than a player ram since
        // this is incidental contact, not a deliberate hit.
        const bumpSpeed = (Math.abs(a.speed) + Math.abs(b.speed)) * 0.3 + 1;
        a.pushVX = (a.pushVX || 0) - nx * bumpSpeed;
        a.pushVZ = (a.pushVZ || 0) - nz * bumpSpeed;
        b.pushVX = (b.pushVX || 0) + nx * bumpSpeed;
        b.pushVZ = (b.pushVZ || 0) + nz * bumpSpeed;
        a.speed *= 0.6;
        b.speed *= 0.6;
      }
    }
  }
}

// =========================================================
// MINIMAP — top-left 2D canvas overlay
// =========================================================
const MM_SIZE = 190;
const MM_PAD  = 10;
const MM_WORLD = CITY_SIZE * BLOCK;
const MM_SCALE = MM_SIZE / MM_WORLD;
const mmView = { cx:0, cz:0, size:MM_WORLD }; // what part of the world the minimap shows
let mmRegion = 'city';
const mmRoads = [];                            // roads of the extra maps + bridges (world rects)

const minimap = document.createElement('canvas');
minimap.width  = MM_SIZE;
minimap.height = MM_SIZE;
minimap.style.cssText = `position:fixed;top:${MM_PAD}px;left:${MM_PAD}px;z-index:20;border:2px solid rgba(255,204,0,0.35);border-radius:6px;background:rgba(0,0,0,0.7);box-shadow:0 0 12px rgba(0,0,0,0.7);`;
document.body.appendChild(minimap);
const mmCtx = minimap.getContext('2d');

function worldToMM(wx, wz){
  return {
    x: ((wx - mmView.cx) / mmView.size + 0.5) * MM_SIZE,
    y: ((wz - mmView.cz) / mmView.size + 0.5) * MM_SIZE,
  };
}

// pre-compute building rects for the minimap (done once, not every frame)
const mmBuildings = [];
cityGroup.children.forEach(obj=>{
  if(obj.geometry && obj.geometry.type === 'BoxGeometry' && obj.geometry.parameters.height > 1){
    mmBuildings.push({ x: obj.position.x, z: obj.position.z, w: obj.geometry.parameters.width, d: obj.geometry.parameters.depth });
  }
});

let mmPulse = 0; // drives the objective marker pulse

function drawMinimap(){
  mmPulse += 0.05;
  mmCtx.clearRect(0, 0, MM_SIZE, MM_SIZE);

  // background
  mmCtx.fillStyle = '#0d1117';
  mmCtx.fillRect(0, 0, MM_SIZE, MM_SIZE);

  // buildings — dark grey fill so city layout is readable
  const mmS = MM_SIZE / mmView.size;
  // roads of the extra maps and bridges (a closed bridge shows red)
  mmRoads.forEach(r=>{
    const p = worldToMM(r.x, r.z);
    mmCtx.fillStyle = r.deck && !r.deck.open ? '#5a1f1f' : '#2e3a4a';
    mmCtx.fillRect(p.x - r.w*mmS/2, p.y - r.d*mmS/2, r.w*mmS, r.d*mmS);
  });

  mmCtx.fillStyle = '#1e2530';
  mmBuildings.forEach(b=>{
    const p = worldToMM(b.x, b.z);
    mmCtx.fillRect(p.x - b.w*mmS/2, p.y - b.d*mmS/2, b.w*mmS, b.d*mmS);
  });

  // road grid — slightly brighter than buildings (city only)
  if(mmRegion === 'city'){
    mmCtx.strokeStyle = '#2e3a4a';
    mmCtx.lineWidth = 2;
    for(let i = 0; i <= CITY_SIZE; i++){
      const worldPos = (i - CITY_SIZE/2) * BLOCK;
      const mm = worldToMM(worldPos, 0);
      mmCtx.beginPath(); mmCtx.moveTo(mm.x, 0);        mmCtx.lineTo(mm.x, MM_SIZE); mmCtx.stroke();
      mmCtx.beginPath(); mmCtx.moveTo(0, mm.y);        mmCtx.lineTo(MM_SIZE, mm.y); mmCtx.stroke();
    }
  }

  // objective markers — pulsing yellow rings
  if(missionSys.state === 'active'){
    const def = missionSys.defs[missionSys.currentIndex];
    def.objectives.forEach(obj=>{
      if(obj.type !== 'reach') return;
      if(missionSys.objectiveProgress.has(obj.id)) return;
      const p = worldToMM(obj.x, obj.z);
      const pulse = 4 + Math.sin(mmPulse) * 2;
      mmCtx.beginPath();
      mmCtx.arc(p.x, p.y, pulse, 0, Math.PI*2);
      mmCtx.fillStyle = '#ffcc00';
      mmCtx.fill();
      // outer ring
      mmCtx.beginPath();
      mmCtx.arc(p.x, p.y, pulse + 3, 0, Math.PI*2);
      mmCtx.strokeStyle = 'rgba(255,204,0,0.4)';
      mmCtx.lineWidth = 1.5;
      mmCtx.stroke();
    });
  }

  // target car (mission 4) — red dot
  if(targetCar && !targetCar.caught && !targetCar.reachedHarbor){
    const p = worldToMM(targetCar.obj.position.x, targetCar.obj.position.z);
    mmCtx.beginPath();
    mmCtx.arc(p.x, p.y, 4, 0, Math.PI*2);
    mmCtx.fillStyle = '#ff4444';
    mmCtx.fill();
  }

  // cops — blue dots
  copCars.forEach(c=>{
    if(!c.alive) return;
    const src = c.onFoot && c.copPed ? c.copPed.position : c.obj.position;
    const p = worldToMM(src.x, src.z);
    mmCtx.beginPath();
    mmCtx.arc(p.x, p.y, 3.5, 0, Math.PI*2);
    mmCtx.fillStyle = '#4499ff';
    mmCtx.fill();
  });

  // player arrow
  const playerPos  = mode === 'car' ? car.obj.position : ped.obj.position;
  const playerHead = mode === 'car' ? car.heading       : ped.heading;
  const pp = worldToMM(playerPos.x, playerPos.z);

  mmCtx.save();
  mmCtx.translate(pp.x, pp.y);
  // canvas rotate(0) = pointing right (+X). World heading 0 = +Z = down on canvas = PI/2 in canvas.
  // So canvas angle = playerHead + PI/2, then negate X component since canvas X is flipped vs world X
  // Simpler: negate heading then subtract PI/2.
  mmCtx.rotate(-playerHead + Math.PI/2);
  mmCtx.beginPath();
  mmCtx.moveTo(8, 0);    // tip points right in local space (canvas 0°), which maps to world forward after rotation
  mmCtx.lineTo(-5, 5);
  mmCtx.lineTo(-5, -5);
  mmCtx.closePath();
  mmCtx.fillStyle = mode === 'car' ? '#ff3333' : '#ffffff';
  mmCtx.fill();
  // white outline so it pops on dark backgrounds
  mmCtx.strokeStyle = 'rgba(255,255,255,0.6)';
  mmCtx.lineWidth = 1;
  mmCtx.stroke();
  mmCtx.restore();

  // compass — N label top-right corner
  mmCtx.fillStyle = 'rgba(255,255,255,0.5)';
  mmCtx.font = 'bold 10px monospace';
  mmCtx.fillText('N', MM_SIZE - 12, 14);
}

// EXTRA MAPS — Rustfield (poor suburb, west) + Fenwick County (countryside, east)
// Each sits on its own island and joins the city by a bridge that stays closed
// (and deadly) until the story unlocks it: Rustfield from chapter 2, Fenwick from chapter 3.
// =========================================================
const MAPS = [
  { id:'suburb',  label:'Rustfield',      name:'RUSTFIELD',      dir:-1, cx:-500, unlock:1, open:false, announce:0 },
  { id:'country', label:'Fenwick County', name:'FENWICK COUNTY', dir: 1, cx: 500, unlock:2, open:false, announce:0 },
];
const BR_A = 200, BR_B = 300; // bridge deck runs from |x|=200 to |x|=300 along z=0

// which part of the world is this point in? null = open water
function regionAt(x, z){
  const ax = Math.abs(x), az = Math.abs(z);
  if(ax <= 208 && az <= 208) return 'city';
  for(const m of MAPS) if(Math.abs(x - m.cx) <= 208 && az <= 208) return m.id;
  if(az <= 7 && ax > 208 && ax < 292) return 'bridge';
  return null;
}

// raise / lower the roadblock on a bridge
function setGate(m, locked){
  m.gate.visible = locked;
  m.gateBoxes.forEach(b=>{
    const i = buildingBoxes.indexOf(b);
    if(locked && i < 0) buildingBoxes.push(b);
    if(!locked && i >= 0) buildingBoxes.splice(i, 1);
  });
}

(function buildExtraMaps(){
  let R = mulberry32(90210);
  const rr = (a,b)=> a + R()*(b-a);

  const asMat = c => typeof c === 'number' ? L(c) : c;
  // same look as the city rooftops: grey speckle + seams, tinted per roof colour
  const roofTex = (()=>{
    const c = document.createElement('canvas'); c.width = c.height = 128;
    const g = c.getContext('2d'); g.fillStyle = '#bbb'; g.fillRect(0,0,128,128);
    for(let i=0;i<1600;i++){ const v = 110 + Math.random()*110|0; g.fillStyle = 'rgba('+v+','+v+','+v+',.55)'; g.fillRect(Math.random()*128,Math.random()*128,2,2); }
    g.strokeStyle = 'rgba(0,0,0,.22)'; g.lineWidth = 2;
    for(let i=0;i<4;i++){ g.beginPath(); g.moveTo(0,i*32+16); g.lineTo(128,i*32+16); g.stroke(); }
    g.strokeRect(2,2,124,124);
    const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(0.3,0.3); return t;
  })();
  const _rm = {};
  const RL = c => _rm[c] || (_rm[c] = new THREE.MeshLambertMaterial({color:c, map:roofTex}));
  const xg = new THREE.Group(); scene.add(xg);
  const grounds = [];

  // ---------- small builders ----------
  function add(m, solid){
    xg.add(m);
    if(solid){
      m.updateMatrixWorld(true);
      buildingBoxes.push(new THREE.Box3().setFromObject(m));
      const p = m.geometry.parameters;
      if(p && p.width && p.height > 1) mmBuildings.push({x:m.position.x, z:m.position.z, w:p.width, d:p.depth});
    }
    return m;
  }
  function bx(w,h,d,x,y,z,col,solid){
    const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), asMat(col));
    m.position.set(x,y,z);
    m.castShadow = h > 0.6; m.receiveShadow = true;
    return add(m, solid);

    const BRICK = [0x8a4a3a,0x7a3f33,0x9a5a42,0xa06048,0xb89a72,0x8f5a44];       // red + tan brick
    const SIDING = [0xd8cdb0,0x9fb0b8,0xe0ddd2,0xb7c4a8];                        // aluminum siding
    const WALLS = BRICK.concat(BRICK, SIDING);                                    // brick-heavy, like the real thing
    const ROOFC = [0x3a3a3e,0x4a4540,0x2f3a3a,0x3d3830];                         // asphalt shingle
    const AMER  = [0x1f2a44,0x7a1f1f,0xb8b8b4,0x2e4a38,0x5a5a5e,0xe0dcd0,0x3a4a6a]; // sedans, minivans, work trucks
    const LAWN  = [0x5e7a3a,0x68823f,0x567236,0x5f7a3e];
    const GRID = ['HHKHHD','DHHHSH','AHHCHH','HHPHDH','HBHAHH','DHHHBH'];

    // front porch with roof + two posts, on the door side of a house
    function porch(hx,hz,d,ds,pw,roofH,roofCol){
      const pz = hz + ds*(d/2+1.1);
      bx(pw,0.3,2.2,hx,0.2,pz,0xb5b0a4);

      bx(38.4,0.15,38.4,ccx,0.075,ccz,0x9a9a94);                                  // concrete sidewalk slab
      const corner = ()=> [ccx + pick([-1,1])*rr(10,16), ccz + pick([-1,1])*rr(10,16)];

      if(t === 'H' || t === 'D'){
        // brick bungalow / two-family flat: lawn, porch, chimney, driveway, detached garage out back
        pad(34,34,ccx,ccz,pick(LAWN),0.17);
        const ds = R()<0.5 ? 1 : -1, side = R()<0.5 ? 1 : -1;
        const flat = t === 'D';
        const w = flat ? rr(13,15) : rr(9,12), d = flat ? rr(9,10) : rr(8,10);

  // =======================================================
  // TEXTURES — grit on ground/roads/sidewalks, brick-ish panels on every wall (city + new maps)
  // =======================================================
  function mkTex(base, draw){
    const c = document.createElement('canvas'); c.width = c.height = 128;
    const g = c.getContext('2d'); g.fillStyle = base; g.fillRect(0,0,128,128);
    draw(g);
    const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; return t;
  }
  const speckle = (g,n)=>{ for(let i=0;i<n;i++){ const v = 185 + Math.random()*70|0; g.fillStyle = 'rgba('+v+','+v+','+v+',.55)'; g.fillRect(Math.random()*128,Math.random()*128,2,2); } };
  const gritTex = mkTex('#ececec', g=> speckle(g,2400));
  const wallTex = mkTex('#e6e6e6', g=>{
    speckle(g,1200);
    g.fillStyle = 'rgba(0,0,0,.18)';
    for(let r=0;r<8;r++){
      g.fillRect(0,r*16,128,2);                                   // mortar courses
      for(let x=(r%2?0:32); x<128; x+=64) g.fillRect(x,r*16,2,16); // staggered joints
    }
  });
  const _uvDone = new Set();
  // UVs are 0..1 per face by default; stretch them to world size so the texture keeps a constant scale
  function scaleUV(geo, tile){
    if(_uvDone.has(geo.uuid)) return; _uvDone.add(geo.uuid);
    const p = geo.parameters, uv = geo.attributes.uv; if(!uv) return;
    const f = (i0,n,a,b)=>{ for(let i=i0;i<i0+n;i++) uv.setXY(i, uv.getX(i)*a/tile, uv.getY(i)*b/tile); };
    if(geo.type === 'BoxGeometry'){
      f(0,8,p.depth,p.height); f(8,8,p.width,p.depth); f(16,8,p.width,p.height);   // ±x, ±y, ±z faces
    } else if(geo.type === 'PlaneGeometry') f(0,uv.count,p.width,p.height);
    else if(geo.type === 'CircleGeometry') f(0,uv.count,p.radius*2,p.radius*2);
    uv.needsUpdate = true;
  }
  const _tm = {};
  const withMap = (mat, tex)=>{ const k = mat.uuid + tex.uuid; if(!_tm[k]){ const c = mat.clone(); c.map = tex; _tm[k] = c; } return _tm[k]; };

  // city: shared road / sidewalk / grass materials get the map in place (so the Simple/Fancy swap keeps working)
  ['road','sidewalk','grass'].forEach(k=> ['simple','fancy'].forEach(q=>{ MAT_SETS[k][q].map = gritTex; MAT_SETS[k][q].needsUpdate = true; }));
  scaleUV(ground.geometry, 6);
  cityGroup.children.forEach(o=>{
    if(!o.geometry || o.geometry.type !== 'BoxGeometry') return;
    const m = o.material;
    if(m === MAT_SETS.road.simple || m === MAT_SETS.road.fancy || m === MAT_SETS.sidewalk.simple || m === MAT_SETS.sidewalk.fancy) scaleUV(o.geometry, 4);
    else if(o.geometry.parameters.height > 1){ m.map = wallTex; m.needsUpdate = true; scaleUV(o.geometry, 4); }  // buildings
  });
  // new maps
  grounds.forEach(g=>{ scaleUV(g.geometry, 6); g.material = withMap(g.material, gritTex); });
  xg.children.forEach(o=>{
    const g = o.geometry; if(!g || !o.material || o.material.map) return;   // fields, signs, graffiti, roofs keep their own
    if(g.type === 'BoxGeometry'){
      if(g.parameters.height < 0.05) return;                                 // lane dashes / court lines
      scaleUV(g, 4); o.material = withMap(o.material, g.parameters.height > 1.2 ? wallTex : gritTex);
    } else if(g.type === 'PlaneGeometry'){ scaleUV(g, 6); o.material = withMap(o.material, gritTex); }
    else if(g.type === 'CircleGeometry'){ scaleUV(g, 6); o.material = withMap(o.material, gritTex); }
  });
})();

const _spawnCopBase = spawnCop;
spawnCop = function(){
  const P = mode === 'car' ? car.obj.position : ped.obj.position;
  if(regionAt(P.x, P.z) === 'city'){ _spawnCopBase(); return; }
  if(!starLock) return;
  for(let k=0;k<14;k++){
    const a = Math.random()*Math.PI*2, d = 45 + Math.random()*30;
    const x = P.x + Math.sin(a)*d, z = P.z + Math.cos(a)*d;

    const cop = buildCar(0x1144cc);

    bar.position.set(0,1.85,-0.2); cop.add(bar);
    cop.position.set(x,0,z); scene.add(cop);
    copCars.push({ obj:cop, heading:0, speed:0, maxSpeed:34, accel:26, alive:true, bustTimer:0, onFoot:false, copPed:null,
      copHp:3, copPunchTimer:0, copWalkCycle:0, pushVX:0, pushVZ:0 });
    return;

};

// per-frame: unlocks, closed-bridge roadblocks, drowning, region cards, minimap view, shadow follow
let mapRegion = 'city', warnT = 0;
scene.add(sun.target);
const sunOff = sun.position.clone(), sunLast = sun.position.clone();

function tickMaps(dt){
  const P = mode === 'car' ? car.obj.position : ped.obj.position;
  const rg = regionAt(P.x, P.z);

  // open water = drowned
  if(rg === null && health.alive){ health.alive = false; showMissionBanner('You drowned.', 3); }

  // unlock bridges as the story moves on (relocks when a new game starts)
  MAPS.forEach(m=>{
    const u = (missionSys.currentIndex === window.CH2X ? 6.5 : missionSys.currentIndex) >= m.unlock;
    if(u !== m.open){ m.open = u; setGate(m, !u); m.announce = u ? 4.6 : 0; }
    if(m.announce > 0){ m.announce -= dt; if(m.announce <= 0) regionCard('BRIDGE OPEN', m.name); }
  });

  // closed bridge: warn on approach, open fire once you are on the deck
  warnT -= dt;
  MAPS.forEach(m=>{
    if(!m.open && rg === 'city' && P.x*m.dir > BR_A-30 && Math.abs(P.z) < 16 && warnT <= 0){
      showMissionBanner('The bridge to ' + m.label + ' is closed. Turn back.', 3); warnT = 6;
    }
  });
  // crossing onto a closed bridge = 5 stars that won't drop until you die or leave (back to the city)
  if(!copRouteWrapped){
    copRouteWrapped = true;
    const _route = copNextWaypointTarget;
    copNextWaypointTarget = function(f, t){ return regionAt(f.x, f.z) === 'city' ? _route(f, t) : t; };
  }
  if(!starLock && rg === 'bridge'){
    const m = MAPS.find(mm => P.x*mm.dir > 0);
    if(m && !m.open && health.alive){
      starLock = m;
      commitCrime(5);
      showMissionBanner('You crossed a closed bridge. The army is after you!', 3);
    }
  }
  if(starLock){
    const here = rg === 'bridge' || rg === starLock.id;
    if(!here || starLock.open || !health.alive) starLock = null;   // left the area, bridge opened, or died
    else { wanted.level = 5; wanted.timeSinceSeenByCop = 0; }       // stars frozen at 5
  }
  // outside the city, cops only exist while the lock is on
  if(rg !== 'city' && !starLock && copCars.length) despawnAllCops();

  // region card + minimap view
  if(rg){
    if(rg !== 'bridge' && rg !== mapRegion){
      mapRegion = rg;
      regionCard('NOW ENTERING', rg === 'city' ? 'CONCRETE HEIGHTS' : MAPS.find(m=>m.id===rg).name);
    }
    mmRegion = rg;
    if(rg === 'city'){ mmView.cx = 0; mmView.cz = 0; mmView.size = MM_WORLD; }
    else if(rg === 'bridge'){ mmView.cx = (P.x > 0 ? 1 : -1)*250; mmView.cz = 0; mmView.size = 180; }
    else { mmView.cx = MAPS.find(m=>m.id===rg).cx; mmView.cz = 0; mmView.size = 420; }

  copCars.forEach(q=>{if(q===c||!q.alive||q.onFoot)return;const sx=o.x-q.obj.position.x,sz=o.z-q.obj.position.z,sd=Math.hypot(sx,sz);if(sd<7&&sd>.1){nt.x+=sx/sd*(7-sd)*1.5;nt.z+=sz/sd*(7-sd)*1.5}});
  c._pt=(c._pt||0)+dt;
  if(c._pt>.7){const m=c._px===undefined?99:Math.hypot(o.x-c._px,o.z-c._pz);c._px=o.x;c._pz=o.z;c._pt=0;if(vmax>6&&m<1.2&&dist>12&&!(c._rev>0)){c._rev=1.1;c._rs=Math.random()<.5?1:-1;c._nrev=(c._nrev||0)+1;c._nrt=8;
    if(c._nrev>=2&&(dist>45||!los)){const w=waypoints[nearestWaypointIndex(o)],ax=Math.abs(o.x-w.x)<Math.abs(o.z-w.z);if(ax)o.x=w.x;else o.z=w.z;c._nrev=0;c.speed=0}}}
  if(c._nrt>0&&(c._nrt-=dt)<=0)c._nrev=0;
  if(c._rev>0){c._rev-=dt;c.speed=THREE.MathUtils.lerp(c.speed,-9,dt*3);c.heading+=c._rs*1.2*dt}
  else{
   const d0=wrap(Math.atan2(nt.x-o.x,nt.z-o.z)-c.heading);
   let av=0,blk=0;const pr=4+Math.abs(c.speed)*.22;
   for(const a of[-.5,0,.5]){const h=c.heading+a,r=a?pr*.75:pr;if(circleHitsAnyObstacle(o.x+Math.sin(h)*r,o.z+Math.cos(h)*r,a?1.65:1.9)){blk++;av+=a?-Math.sign(a)*.45:(Math.sign(d0)||1)*.6;if(!a&&c.speed>3)vmax=Math.min(vmax,Math.max(8,vmax*.7))}}
   const d=wrap(d0+av),tc=THREE.MathUtils.lerp(4,1.6,Math.min(1,Math.abs(c.speed)/vmax))*dt;
   c.heading+=cl(d,-tc,tc);
   {const tv=vmax*(1-Math.min(1,Math.abs(d)/Math.PI)*.6);c.speed=THREE.MathUtils.lerp(c.speed,tv,dt*(tv<c.speed?4:1.6))}
  }
  pushOut(o,1.65);
  const md=c.speed*dt,nx=o.x+Math.sin(c.heading)*md,nz=o.z+Math.cos(c.heading)*md;
  if(!circleHitsAnyObstacle(nx,nz,1.6)){o.x=nx;o.z=nz;c._bt=0}
  else if(!circleHitsAnyObstacle(nx,o.z,1.6))o.x=nx;
  else if(!circleHitsAnyObstacle(o.x,nz,1.6))o.z=nz;
  else{c.speed*=.5;c._bt=(c._bt||0)+dt;if(c._bt>1.5){const w=waypoints[nearestWaypointIndex(o)];o.set(w.x,0,w.z);c._bt=0}}
  c.obj.rotation.y=c.heading;c.obj.userData.wheels.forEach(w=>{w.rotation.x+=c.speed*dt*2});
  // contact with the player's car: modest damage, PIT shove; you ramming them at speed is a crime

  if(mode==='car'&&dist<3.4&&c._hit===0){damagePlayer(2+Math.abs(car.speed-c.speed)*.3);c._hit=.7;if(Math.abs(car.speed)>14&&Date.now()-lastRam>4000){lastRam=Date.now();commitCrime(1)}}
  if(mode==='car'&&car.v&&T.pit>0&&dt>0&&dist<5.5&&dist>.1&&Math.abs(car.speed)>8){
   const k=(5.5-dist)/2.5*T.pit,nx2=(car.obj.position.x-o.x)/dist,nz2=(car.obj.position.z-o.z)/dist;
   car.v.x+=nx2*20*k*dt;car.v.z+=nz2*20*k*dt;car.heading+=Math.sign(Math.sin(car.heading)*nz2-Math.cos(car.heading)*nx2)*.8*k*dt;

 else if(dt>0&&!(typeof starLock!=='undefined'&&starLock)){

<script>
// =========================================================
// TERRAIN — real rolling ground. One height function H(x,z) drives the ground meshes, roads, slabs and lawns
// (they bend with it), buildings (level roof, taller on the downhill side), and cars/peds (ride the surface,
// cars pitch + roll, hills are fast going down and slow going up). Runs after every other script has built the world.
// =========================================================
(()=>{
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const sstep=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t)};

// ---------- the height field ----------
const AMP={city:2.4,suburb:4.5,country:5.8};
function nrm(kind,x,z){
  let f;
  if(kind==='city')        f=0.60*Math.sin(x*0.043+1.3)*Math.cos(z*0.037+0.4)+0.40*Math.sin((x*0.6+z)*0.026+2.0);
  else if(kind==='suburb'){ const g=(cx,cz,r)=>Math.exp(-((x-cx)*(x-cx)+(z-cz)*(z-cz))/(2*r*r)); return clamp(0.08+0.85*g(-90,70,55)+0.6*g(100,-80,70),0,1); } // Rustfield: mostly flat, just two broad hills
  else                     f=0.55*Math.sin(x*0.030+2.2)*Math.cos(z*0.026+0.9)+0.35*Math.sin((x+z*0.8)*0.020+0.4)+0.10*Math.sin(x*0.08+z*0.07);
  return clamp(0.5+0.5*f,0,1);
}
// level pads (local coords: cx, cz, half-width, half-depth) where the ground is flattened so compound buildings stay together
const FLAT={
  suburb:[[-176,0,26,38],[132,153,10,16]],                                    // assembly plant yard
  country:[[-80,-84,34,30],[95,96,38,30],[40,-11,26,14],[140,50,28,28]], // farm A, farm B, general store, pond
  city:[]
};
function rawEdge(kind,lx,lz){
  return AMP[kind]*nrm(kind,lx,lz)*sstep(0,40,192-Math.max(Math.abs(lx),Math.abs(lz)));
}
function kindAt(x,z){
  if(Math.abs(z)>208) return null;
  if(Math.abs(x)<=208) return ['city',x,z];
  if(Math.abs(x+500)<=208) return ['suburb',x+500,z];
  if(Math.abs(x-500)<=208) return ['country',x-500,z];
  return null;
}
function H(x,z){
  const k=kindAt(x,z); if(!k) return 0;
  const kind=k[0],lx=k[1],lz=k[2];
  let h=rawEdge(kind,lx,lz);
  const zs=FLAT[kind];
  for(let i=0;i<zs.length;i++){
    const q=zs[i];
    const dx=Math.max(Math.abs(lx-q[0])-q[2],0), dz=Math.max(Math.abs(lz-q[1])-q[3],0);
    const m=1-sstep(0,48,Math.hypot(dx,dz));
    if(m>0) h+=(rawEdge(kind,q[0],q[1])-h)*m;
  }
  return h;
}
function grad(x,z){ const e=0.6; return [(H(x+e,z)-H(x-e,z))/(2*e),(H(x,z+e)-H(x,z-e))/(2*e)]; }
function slopeAlong(x,z,hd){ const g=grad(x,z); return g[0]*Math.sin(hd)+g[1]*Math.cos(hd); }
window.TERRAIN={H,grad,slopeAlong};

// ---------- bake it into the static world ----------
const isEnt=o=>o.userData&&(o.userData.wheels||o.userData.legL);
const treeMats=new Set([treeTrunkMat,bushMat].concat(treeFoliageMats));
scene.updateMatrixWorld(true);
const meshes=[];
(function walk(o){ if(isEnt(o)||o.isLight) return; if(o.isMesh) meshes.push(o); for(let i=0;i<o.children.length;i++) walk(o.children[i]); })(scene);
// the mission marker group is dynamic (children are re-created each mission) — leave it out of the bake
const mk=new Set(); markerGroup.traverse(o=>mk.add(o));

const tmp=new THREE.Box3();
const info=meshes.filter(m=>!mk.has(m)).map(m=>{
  tmp.setFromObject(m);
  return {m,min:tmp.min.clone(),max:tmp.max.clone(),cx:(tmp.min.x+tmp.max.x)/2,cz:(tmp.min.z+tmp.max.z)/2,
          w:tmp.max.x-tmp.min.x,h:tmp.max.y-tmp.min.y,d:tmp.max.z-tmp.min.z};
});
const flatRot=m=>Math.abs(m.rotation.x+Math.PI/2)<1e-3;
for(const it of info){
  const m=it.m,t=m.geometry.type,cy=(it.min.y+it.max.y)/2;
  it.kind='rigid';
  if(it.max.y<-0.05) it.kind='skip';                                                                // water + shore rings stay put
  else if((t==='PlaneGeometry'&&flatRot(m)&&cy<0.4)||(t==='CircleGeometry'&&flatRot(m)&&cy<0.4)||
          (t==='BoxGeometry'&&it.h<0.35&&Math.max(it.w,it.d)>3.5&&cy<0.4)) it.kind='surface';       // ground, roads, slabs, lawns, lane marks
  else if((t==='BoxGeometry'||t==='CylinderGeometry')&&it.h>=2&&it.w>=2.4&&it.d>=2.4&&it.min.y<0.3&&!treeMats.has(m.material)) it.kind='struct';  // buildings
  else if(t==='BoxGeometry'&&Math.max(it.w,it.d)>8&&Math.min(it.w,it.d)<=2.4) it.kind='line';      // long walls / fence rails
}

function bakeSurface(it,seg,tile){
  const m=it.m,g=m.geometry,p=g.parameters; let ng;
  if(g.type==='PlaneGeometry') ng=new THREE.PlaneGeometry(p.width,p.height,Math.max(1,Math.ceil(p.width/seg)),Math.max(1,Math.ceil(p.height/seg)));
  else if(g.type==='BoxGeometry') ng=new THREE.BoxGeometry(p.width,p.height,p.depth,Math.max(1,Math.ceil(p.width/seg)),1,Math.max(1,Math.ceil(p.depth/seg)));
  else ng=g.clone();
  ng.applyMatrix4(m.matrixWorld);
  const P=ng.attributes.position, U=ng.attributes.uv;
  for(let i=0;i<P.count;i++){
    const x=P.getX(i),z=P.getZ(i);
    P.setY(i,P.getY(i)+H(x,z));
    if(U&&g.type!=='CircleGeometry') U.setXY(i,x/tile,z/tile);
  }
  ng.computeVertexNormals(); ng.computeBoundingBox(); ng.computeBoundingSphere();
  m.geometry=ng; m.position.set(0,0,0); m.rotation.set(0,0,0); m.scale.set(1,1,1); m.updateMatrix();
}
const structs=[];
for(const it of info){
  if(it.kind==='surface'){ const big=it.m.geometry.type==='PlaneGeometry'&&Math.max(it.w,it.d)>40; bakeSurface(it,big?6:4,it.m.geometry.type==='PlaneGeometry'?6:4); }
  else if(it.kind==='line') bakeSurface(it,4,4);
  else if(it.kind==='struct'){
    const m=it.m, hc=H(it.cx,it.cz), g=m.geometry.clone(); g.applyMatrix4(m.matrixWorld);
    const P=g.attributes.position, y0=it.min.y;
    for(let i=0;i<P.count;i++){
      const y=P.getY(i);
      if(y<=y0+0.12) P.setY(i,Math.min(hc,H(P.getX(i),P.getZ(i)))+(y-y0));   // foundation reaches down to the real ground
      else P.setY(i,y+hc);                                                    // everything above stays level
    }
    g.computeBoundingBox(); g.computeBoundingSphere();
    m.geometry=g; m.position.set(0,0,0); m.rotation.set(0,0,0); m.scale.set(1,1,1); m.updateMatrix();
    it.hc=hc; structs.push(it);
  }
}
// everything else rides with the building it belongs to (windows, doors, porches, chimneys, roof clutter, roofs) or sits on the ground at its own spot
const E=2.1;
for(const it of info){
  if(it.kind!=='rigid') continue;
  const m=it.m; let dy=null;
  if(!treeMats.has(m.material)){
    let best=1e9;
    for(const s of structs){
      if(it.cx<s.min.x-E||it.cx>s.max.x+E||it.cz<s.min.z-E||it.cz>s.max.z+E) continue;
      const d=Math.abs(it.cx-s.cx)+Math.abs(it.cz-s.cz);
      if(d<best){best=d;dy=s.hc}
    }
  }
  if(dy===null) dy=H(it.cx,it.cz);
  m.position.y+=dy; m.updateMatrix();
}
scene.updateMatrixWorld(true);

// ---------- runtime: entities ride the surface (applied at render time so all game logic keeps working in flat space) ----------
const STATIC=new Set(); scene.children.forEach(o=>{ if(!isEnt(o)) STATIC.add(o); });
STATIC.delete(markerGroup);
const prevRender=renderer.render;
renderer.render=function(s,c){
  const rec=[];
  for(let i=0;i<scene.children.length;i++){
    const o=scene.children[i];
    if(STATIC.has(o)||o.isLight||!(o.isMesh||o.isGroup)) continue;
    if(o===markerGroup){ for(const ch of o.children){ const h=H(ch.position.x,ch.position.z); ch.position.y+=h; rec.push([ch,h,0,0]); } continue; }
    const h=H(o.position.x,o.position.z); let pt=0,rl=0;
    if(o.userData&&o.userData.wheels){
      if(o.rotation.order!=='YXZ') o.rotation.order='YXZ';
      const g=grad(o.position.x,o.position.z),sn=Math.sin(o.rotation.y),cs=Math.cos(o.rotation.y);
      pt=-Math.atan(g[0]*sn+g[1]*cs); rl=Math.atan(g[0]*cs-g[1]*sn);
      o.rotation.x+=pt; o.rotation.z+=rl;
    }
    o.position.y+=h; rec.push([o,h,pt,rl]);
  }
  try{ return prevRender.call(renderer,s,c); }
  finally{ for(const r of rec){ r[0].position.y-=r[1]; if(r[2]||r[3]){ r[0].rotation.x-=r[2]; r[0].rotation.z-=r[3]; } } }
};

// camera: orbit around the terrain-lifted target and never dip under the ground
const _cam=updateCamera;
updateCamera=function(dt){
  const t=mode==='car'?car.obj:ped.obj, h=H(t.position.x,t.position.z);
  t.position.y+=h;
  try{ _cam(dt); } finally{ t.position.y-=h; }
  const floor=H(camera.position.x,camera.position.z)+1.1;
  if(camera.position.y<floor){ camera.position.y=floor; if(camCurrentPos.y<floor) camCurrentPos.y=floor; camera.lookAt(t.position.x,t.position.y+h+1.2,t.position.z); }
};

// cars: gravity along the slope — quick down, slow up
const _car=updateCar;
updateCar=function(dt){
  const o=car.obj.position, sl=slopeAlong(o.x,o.z,car.heading), m0=car.maxSpeed, a0=car.accel;
  if(dt>0){
    car.speed-=55*sl*dt;
    const target=m0*(1-clamp(sl*5,0,0.55)+clamp(-sl*4,0,0.45));
    car.maxSpeed=Math.max(target,Math.min(car.speed,m0*1.5)-20*dt);   // eases back instead of snapping at the bottom/top of a hill
    car.accel=a0*(1-clamp(sl*4,0,0.55));
  }
  try{ _car(dt); } finally{ car.maxSpeed=m0; car.accel=a0; }
};
// on foot: a bit slower uphill, a bit faster downhill
const _ped=updatePed;
updatePed=function(dt){
  const o=ped.obj.position, sl=slopeAlong(o.x,o.z,ped.heading), m0=ped.maxSpeed;
  ped.maxSpeed=m0*clamp(1-sl*2.6,0.55,1.25);
  try{ _ped(dt); } finally{ ped.maxSpeed=m0; }
};
})();
</script>

<script>
// =========================================================
// STORY LAYER ch1.2 — cutscene system, CS-1, mission 1 start (job car, condition meter)
// =========================================================
(()=>{
const G=window.GX25,V3=THREE.Vector3;
const cssx=document.createElement('style');cssx.textContent='.csb{position:fixed;left:0;right:0;height:12vh;background:#000;z-index:70;pointer-events:none}.css{position:fixed;left:50%;bottom:14vh;transform:translateX(-50%);z-index:71;text-align:center;max-width:70%;font:600 20px Arial,sans-serif;text-shadow:0 0 4px #000,1px 1px 2px #000;pointer-events:none}.css span{color:#ffcc00;display:block;font-size:15px;letter-spacing:.08em;margin-bottom:2px}.css i{font-style:normal;color:#fff}.csk{position:fixed;right:14px;bottom:13vh;z-index:71;color:#ccc;font:13px monospace;pointer-events:none}.cnd{position:fixed;left:14px;bottom:14px;z-index:10;color:#fff;font:700 15px monospace;background:rgba(0,0,0,.6);padding:6px 10px;border-left:4px solid #3c3}';document.head.appendChild(cssx);

 if(on){hidden=[];[...document.body.children].forEach(e=>{if(e.dataset&&e.dataset.cs)return;if(e===renderer.domElement||e.tagName==='SCRIPT'||e.tagName==='STYLE')return;if(e.style&&e.style.position==='fixed'&&e.style.display!=='none'&&!e.classList.contains('cht')&&!e.classList.contains('lg')){hidden.push([e,e.style.visibility]);e.style.visibility='hidden'}})}

 next();
};
function next(){
 cs.i++;if(cs.i>=cs.shots.length)return end();
 const s=cs.shots[cs.i];cs.t=0;cs.li=0;cs.lt=0;
 cs.len=Math.max(s.dur||3,(s.lines||[]).reduce((a,l)=>a+lineDur(l[1]),0));

}
function showLine(){
 const s=cs.shots[cs.i],l=s.lines&&s.lines[cs.li];
 if(!l){sub.style.display='none';return}
 sub.innerHTML='<span>'+l[0]+'</span><i>'+l[1]+'</i>';sub.style.display='block';cs.lt=0;

 if(s.lines&&cs.li<s.lines.length-1){cs.li++;showLine()}else next();
}

 if(d)d();
}

function tickCs(dt){
 if(!cs)return;
 const s=cs.shots[cs.i];cs.t+=dt;
 if(s.at)s.at(cs.t,Math.min(1,cs.t/cs.len));
 if(s.lines&&s.lines.length){cs.lt+=dt;if(cs.lt>=lineDur(s.lines[cs.li][1])){if(cs.li<s.lines.length-1){cs.li++;showLine()}else sub.style.display='none'}}
 if(cs.t>=cs.len)next();
}
// ---- input: nothing reaches the game while frozen; Space/click advance, X skips ----
addEventListener('keydown',e=>{if(!frozen())return;if(e.code==='Escape')return;e.stopImmediatePropagation();e.preventDefault();
 if(cs){if(e.code==='KeyX')G.skip();else if(e.code==='Space'||e.code==='Enter')advance()}},true);
addEventListener('mousedown',e=>{if(!frozen())return;e.stopImmediatePropagation();if(cs)advance()},true);
addEventListener('mousemove',e=>{if(frozen())e.stopImmediatePropagation()},true);

// ---- cutscene camera collision: march from the look point toward the camera and stop short of any wall it would pass through ----
function camClear(lx,ly,lz,cx,cy,cz){
 const M=.55,N=40,skip=[];
 for(const b of buildingBoxes)if(lx>b.min.x-M&&lx<b.max.x+M&&lz>b.min.z-M&&lz<b.max.z+M&&ly<b.max.y+.3)skip.push(b);
 for(let i=1;i<=N;i++){const u=i/N,x=lx+(cx-lx)*u,y=ly+(cy-ly)*u,z=lz+(cz-lz)*u;
  for(const b of buildingBoxes){if(skip.indexOf(b)>=0)continue;
   if(y<b.max.y+.3&&x>b.min.x-M&&x<b.max.x+M&&z>b.min.z-M&&z<b.max.z+M)return Math.max(.3,(i-3)/N)}}
 return 1;
}
// ---- freeze the world (except what the shot drives) ----
const fz=n=>{const o=window[n];window[n]=function(...a){if(frozen())return;return o.apply(this,a)}};
['updatePed','updateCar','updateCops','tickWanted','checkCarCrimes','updateTargetCar','tickHealth','tickBanner'].forEach(fz);
{const o=updateNpcPed;updateNpcPed=function(p,dt){if(frozen())return;return o.call(this,p,dt)}}
{const o=updateTrafficCar;updateTrafficCar=function(t,dt){if(frozen())return;return o.call(this,t,dt)}}
{const o=updateCamera;updateCamera=function(dt){
 if(cs&&cs.i>=0){const s=cs.shots[cs.i],H=(x,z)=>TERRAIN.H(x,z),d=s.drift||[0,0,0],t=cs.t;
  const cx=s.cam[0]+d[0]*t,cy=s.cam[1]+d[1]*t,cz=s.cam[2]+d[2]*t;

 return o.call(this,dt)}}

// =================== MISSION 1 (index 0): job car + Marko ===================
const jobCar=playerCar;
jobCar.traverse(m=>{if(m.isMesh&&m.material&&m.material.color&&m.material.color.getHex()===0xcc3333){m.material=m.material.clone();m.material.color.setHex(0x1f4d2b)}});
let marko=null,cond=100,cdn=0,flipped=false;
G.getMarko=()=>marko;
const cm=()=>missionSys.currentIndex===0&&missionSys.state==='active';
function placeStart(){
 mode='foot';playerPed.visible=true;car.obj=jobCar;car.speed=0;car.heading=0;jobCar.position.set(0,0,15);jobCar.rotation.set(0,0,0);if(car.v)car.v=null;

 if(marko)scene.remove(marko);marko=G.actor(0x111114,2.8,0,2.8,19.5);marko.position.set(2.8,0,16.4);G.face(marko,2.8,19.5);

}

 {cam:[-14,1.6,5],look:[3,1.5,16],dur:4,drift:[.6,0,.7]},
 {cam:[4.1,1.9,21.6],look:[2.8,1.55,16.4],dur:6,drift:[-.02,0,0],lines:[['MARKO','Slate. Like a clean one. Cute.'],['YOU','It\'s the only name this number gave me.'],['MARKO','Right amount of questions. Welcome to the Heights.']]},

];

function buildMarkoPath(route,R,weaveAmp){
 // 1) rounded corners: quadratic fillet through each interior vertex

 for(let i=1;i<route.length-1;i++){

 pts.push({x:raw[raw.length-1][0],z:raw[raw.length-1][1]});
 // 3) headings + curvature (smoothed over +-3 samples)
 const N=pts.length;

function cast(ox,oz,dx,dz,key){

 pks.forEach(p=>{if(p.dead)return;const q=p.g.position,rx=q.x-ox,rz=q.z-oz,d=rx*dx+rz*dz,perp=Math.abs(rx*dz-rz*dx);if(d>1&&d<w.rng&&perp<1.9&&d<bd){bd=d;best=p}});

}

const _copsAI=updateCops;
updateCops=function(dt){
 if(!(dt>0)||!copCars.length)return _copsAI.apply(this,arguments);
 const pre=new Map(),M=(car&&car.maxSpeed)||42;
 for(const c of copCars){
  if(!c.alive||!c.obj)continue;
  if(c.onFoot){c.v=null;continue}
  const o=c.obj.position;
  pre.set(c,{x:o.x,z:o.z,h:c.heading,s:c.speed,px:c.pushVX||0,pz:c.pushVZ||0,m0:c.maxSpeed});
  // hills: same gravity + top-speed scaling as the player's car (quick down, slow up)
  if(COP_PHYS.hills&&window.TERRAIN){
   const sl=TERRAIN.slopeAlong(o.x,o.z,c.heading);
   c.speed-=55*sl*dt;
   c.maxSpeed=c.maxSpeed*(1-clamp(sl*5,0,.55)+clamp(-sl*4,0,.45));
  }
 }
 let ret;
 try{ret=_copsAI.apply(this,arguments)}
 finally{for(const [c,p] of pre)c.maxSpeed=p.m0}
 for(const [c,p] of pre){
  if(!c.alive||c.onFoot||!c.obj||copCars.indexOf(c)<0)continue;
  const ob=c.obj,o=ob.position;
  if(ob.rotation.order!=='YXZ')ob.rotation.order='YXZ';
  const ad=Math.hypot(o.x-p.x,o.z-p.z),step=Math.abs(c.speed)*dt;
  // AI didn't move it (frozen / wedged) or snapped it somewhere (unstick, reinforcements): leave that alone
  if(ad<1e-4||ad>step*1.6+Math.hypot(p.px,p.pz)*dt+1.2){c.v=null;continue}
  // same turn-rate limit as the player's bicycle model (no turning while stopped; the reverse-out manoeuvre keeps a minimum)
  if(COP_PHYS.turnLimit){
   const capAt=av=>{if(av<=.05)return 0;const sf=Math.min(1,av/M),maxSteer=.65-.52*Math.pow(sf,.6),grip=30/Math.max(av,1);return Math.min(grip,(av/2.8)*Math.tan(maxSteer))};
   const dh=wrapA(c.heading-p.h),need=Math.abs(dh)/dt; // turn rate the AI asked for
   // too sharp for this speed: brake (at the player's brake force) until the car can actually make the curve
   if(COP_PHYS.brakeForCurves&&!(c._rev>0)&&c.speed>7&&need>capAt(c.speed)){
    let s=c.speed;while(s>7&&need>capAt(s))s*=.94;
    c.speed=Math.max(s,7,c.speed-(car.brakeForce||40)*dt);
   }
   const cap=c._rev>0?Math.max(capAt(Math.abs(c.speed)),1.3):capAt(Math.abs(c.speed)),lim=cap*dt;
   if(Math.abs(dh)>lim)c.heading=p.h+Math.sign(dh)*lim;
   ob.rotation.y=c.heading;
  }
  // momentum + drift: the car's real velocity chases where it's pointing (same blend as the player's car)
  const fx=Math.sin(c.heading)*c.speed,fz=Math.cos(c.heading)*c.speed;
  if(COP_PHYS.momentum){
   const V=c.v||(c.v={x:fx,z:fz}),k=Math.min(1,(Math.abs(c.speed)>28?6:10)*dt);
   V.x+=(fx-V.x)*k;V.z+=(fz-V.z)*k;
   const nx=p.x+(V.x+p.px)*dt,nz=p.z+(V.z+p.pz)*dt;
   if(!circleHitsAnyObstacle(nx,nz,1.6)){o.x=nx;o.z=nz}
   else{
    // momentum carried it into a wall: slide along it, lose the part pointing into it, bounce a little
    const okX=!circleHitsAnyObstacle(nx,p.z,1.6),okZ=!circleHitsAnyObstacle(p.x,nz,1.6),vs=Math.hypot(V.x,V.z);
    if(okX){o.x=nx;o.z=p.z;V.z*=-.4}
    else if(okZ){o.x=p.x;o.z=nz;V.x*=-.4}
    else if(vs>4){V.x*=-.4;V.z*=-.4}
    if(vs>8){c.heading+=(Math.random()-.5)*.12*Math.min(1,vs/25);ob.rotation.y=c.heading;c.speed*=.85}
   }
  }
  // body roll + pitch, same formulas as the player's car
  if(COP_PHYS.lean){
   const yr=wrapA(c.heading-p.h)/dt,ac=(c.speed-p.s)/dt,q=Math.min(1,dt*7);
   const tr=clamp(yr*c.speed*.005,-.16,.16),tp=clamp(-ac*.003,-.07,.07);
   ob.rotation.z+=(tr-ob.rotation.z)*q;ob.rotation.x+=(tp-ob.rotation.x)*q;
  }
 }
 return ret;
};
})();
</script>
<script>
// ---- PERF PATCH: freeze static geometry, skip work in background tab ----
(()=>{
  try{
    const freeze = o => { o.updateMatrix(); o.matrixAutoUpdate = false; };
    // static world pieces: buildings, windows, trees, roads, roofs
    [cityGroup, fancyGroup].forEach(g=>{
      if(!g) return;
      g.updateMatrixWorld(true);
      g.children.forEach(o=>{ if(!o.isLight) freeze(o); });
    });
    // roof props live inside an IIFE: find that group by scanning for the big static group
    scene.children.forEach(o=>{ if(o.isGroup && o!==cityGroup && o!==fancyGroup && o.children.length>20 && o.children.every(c=>c.isMesh && c.castShadow)){ o.updateMatrixWorld(true); o.children.forEach(freeze); } });
    // scenery meshes added directly to the scene that never move (roof slabs, planes)
    scene.children.forEach(o=>{
      if(o.isMesh && o.geometry && (o.geometry.type==='PlaneGeometry') && !o.userData.dynamic) freeze(o);
    });
    // fog/shadow culling friendliness: shadow cam only needs to cover nearby area
    if(typeof sun!=='undefined' && sun.shadow){ sun.shadow.autoUpdate = true; }
  }catch(e){ console.warn('perf patch skipped', e); }
})();
</script>
<script>
// ---- VIEW-DISTANCE CULLING: nothing beyond the fog is drawn or shadowed ----
(()=>{
  try{
    scene.updateMatrixWorld(true);
    const items=[], seen=new Set();
    const addMesh=(m)=>{
      if(seen.has(m)||!m.isMesh||!m.geometry) return; seen.add(m);
      if(!m.geometry.boundingSphere) m.geometry.computeBoundingSphere();
      const bs=m.geometry.boundingSphere, c=bs.center.clone().applyMatrix4(m.matrixWorld);
      const sc=m.matrixWorld.getMaxScaleOnAxis();
      items.push({m, x:c.x, y:c.y, z:c.z, r:bs.radius*sc});
    };
    // static meshes: frozen ones, plus big all-mesh scenery groups (extra maps)
    scene.traverse(o=>{
      if(o.isMesh && o.matrixAutoUpdate===false) addMesh(o);
      if(o.isGroup && o!==scene && o.children.length>40 && o.children.every(c=>c.isMesh)){
        o.updateMatrixWorld(true);
        o.children.forEach(c=>{ c.updateMatrix(); c.matrixAutoUpdate=false; c.updateMatrixWorld(true); addMesh(c); });
      }
    });
    // large ground/water planes must never be culled by centre distance
    const MINR=60; const list=items.filter(i=>i.r<MINR);
    let frame=0, lastFar=0, wasMenu=false;
    const base=renderer.render;
    renderer.render=function(s,c){
      const cam=c||camera, menu=!!(window.GX_MENU&&window.GX_MENU());
      const fog=scene.fog; let fn=0, ff=0;
      if(menu&&fog){ fn=fog.near; ff=fog.far; } // title / story / credits backdrop: keep the normal heavy haze (no fog override)
      const far=fog?fog.far:600;
      const f=far*1.04+8;
      if(Math.abs(f-cam.far)>1){ cam.far=f; cam.updateProjectionMatrix(); }
      if(menu){
        if(!wasMenu){ wasMenu=true; list.forEach(it=>{ if(it.out){ it.out=false; it.m.layers.set(0); } }); }
        try{ return base.call(renderer,s,c); } finally{ if(fog){ fog.near=fn; fog.far=ff; } }
      }
      wasMenu=false;
      if((frame++%4)===0){
        const cx=cam.position.x, cy=cam.position.y, cz=cam.position.z, lim=far*1.04+8;
        for(let i=0;i<list.length;i++){
          const it=list[i], dx=it.x-cx, dy=it.y-cy, dz=it.z-cz, R=lim+it.r;
          const out=(dx*dx+dy*dy+dz*dz)>R*R;
          if(it.out!==out){ it.out=out; if(out) it.m.layers.set(1); else it.m.layers.set(0); }
        }
      }
      return base.call(renderer,s,c);
    };
    console.log('view-distance culling on:', list.length, 'static objects');
  }catch(e){ console.warn('culling skipped', e); }
})();
</script>
<script>
// ---- TAB COMMAND CONSOLE: press Tab, type  chapter:mission  (e.g. 1:2, 2:1, 3:3)  then Enter ----
(()=>{
  const CH=[{s:0,n:4},{s:4,n:4},{s:7,n:3}];            // chapter 1: missions 1-4, ch2: 5-7, ch3: 8-10 (indices 0-9)
  const bar=document.createElement('div');
  bar.style.cssText='position:fixed;left:50%;bottom:9%;transform:translateX(-50%);z-index:2000;display:none;width:min(520px,90vw);font:14px monospace;color:#fff;background:rgba(10,10,12,.92);border:2px solid #ffcc00;border-radius:6px;padding:10px 12px;box-shadow:0 0 24px rgba(0,0,0,.8)';
  bar.innerHTML='<div style="color:#ffcc00;letter-spacing:.15em;font-size:12px;margin-bottom:6px">COMMAND  (Tab / Esc to close)</div><div style="display:flex;gap:6px;align-items:center"><span style="color:#ffcc00">&gt;</span><input id="gx-cmd" autocomplete="off" spellcheck="false" placeholder="godmode  or  1:2" style="flex:1;background:transparent;border:0;outline:0;color:#fff;font:inherit"></div><div id="gx-cmsg" style="margin-top:6px;color:#9ab;min-height:1.2em"></div>';
  document.body.appendChild(bar);
  const inp=bar.querySelector('#gx-cmd'), msg=bar.querySelector('#gx-cmsg');
  // ---------- GOD MODE: fly, no collisions, invincible ----------
  let god=false;
  const tag=document.createElement('div');
  tag.style.cssText='position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:30;display:none;font:700 13px monospace;letter-spacing:.2em;color:#ffcc00;background:rgba(0,0,0,.6);border:1px solid #ffcc00;border-radius:4px;padding:4px 10px';
  tag.textContent='GOD MODE  ·  WASD fly  ·  Space up  ·  Ctrl/C down  ·  Shift fast';
  document.body.appendChild(tag);
  const _ud=updateCar, _up2=updatePed, _dmg=damagePlayer, _tm=tickMaps;
  function fly(dt){
    const ent=(mode==='car')?car:ped, o=ent.obj.position;
    const fa=cameraYaw+Math.PI, fx=Math.sin(fa), fz=Math.cos(fa), rx=fz, rz=-fx;
    let mx=0,mz=0,my=0;
    if(keys.KeyW) {mx+=fx;mz+=fz} if(keys.KeyS){mx-=fx;mz-=fz}
    if(keys.KeyD) {mx+=rx;mz+=rz} if(keys.KeyA){mx-=rx;mz-=rz}
    if(keys.Space) my+=1; if(keys.ControlLeft||keys.ControlRight||keys.KeyC) my-=1;
    const L=Math.hypot(mx,mz); if(L>0){mx/=L;mz/=L}
    const sp=(keys.ShiftLeft||keys.ShiftRight)?140:45;
    o.x+=mx*sp*dt; o.z+=mz*sp*dt; o.y=Math.max(0,o.y+my*sp*.8*dt);
    if(L>0){ const h=Math.atan2(mx,mz); if(ent.heading!==undefined) ent.heading=h; ent.obj.rotation.y=h; }
    ent.speed=0; if(ent.vy!==undefined) ent.vy=0;
    ent.obj.rotation.x=0; ent.obj.rotation.z=0;
    health.hp=health.maxHp; health.alive=true; health.invulnTimer=1;
  }
  updateCar=function(dt){ if(god) return fly(dt); return _ud.apply(this,arguments) };
  updatePed=function(dt){ if(god) return fly(dt); return _up2.apply(this,arguments) };
  damagePlayer=function(){ if(god) return; return _dmg.apply(this,arguments) };
  tickMaps=function(){ const r=_tm.apply(this,arguments); if(god){health.alive=true;health.hp=health.maxHp} return r };
  function setGod(v){
    god=v; tag.style.display=v?'block':'none';
    if(!v){ try{ const ent=(mode==='car')?car:ped; ent.obj.position.y=0 }catch(e){} }
    try{ showMissionBanner(v?'GOD MODE ON':'God mode off',2.5) }catch(e){}
  }

  let open=false, ownsPause=false;
  const say=(t,bad)=>{msg.textContent=t;msg.style.color=bad?'#f77':'#9f9'};
  function show(){
    if(open) return;
    const was=menuOpen;
    if(!was){ openMenu(); if(!menuOpen) return; ownsPause=true; const u=document.getElementById('jsui'); if(u) u.style.display='none'; }
    else ownsPause=false;               // some other menu is already up: just overlay the console
    try{ Object.keys(keys).forEach(k=>keys[k]=false) }catch(e){}
    open=true; bar.style.display='block'; inp.value=''; say('Type  godmode  or  chapter:mission  (e.g. 1:2)'); setTimeout(()=>inp.focus(),0);
  }
  function hide(resume){
    if(!open) return;
    open=false; bar.style.display='none'; inp.blur();
    if(ownsPause&&resume){ try{ closeMenu() }catch(e){} }
    else if(ownsPause){ /* leave pause menu closed state handled by resume */ try{ closeMenu() }catch(e){} }
    ownsPause=false;
  }
  function giveGear(idx){
    try{
      const W=G.weapons; const add=id=>{ if(!W.includes(id)) W.push(id) };
      if(idx>=2) add('pistol'); if(idx>=4) add('bat'); if(idx>=5) add('smg');
    }catch(e){}
  }
  const SPAWN=(idx)=> (idx>=7&&idx!==window.CH2X)?{x:330,z:0,h:Math.PI/2} : idx>=4?{x:-560,z:0,h:-Math.PI/2} : null;
  function jump(ch,ms){
    const c=CH[ch-1]; if(!c) return say('No chapter '+ch+' (valid: 1-3)',true);
    if(!(ms>=1&&ms<=c.n)) return say('Chapter '+ch+' has missions 1-'+c.n,true);
    const idx=(ch===2&&ms===4)?window.CH2X:c.s+ms-1;
    hide(true);
    try{ if(G.inside&&G.inside()!==null&&G.leave) G.leave() }catch(e){}
    setTimeout(()=>{
      try{
        respawnPlayer(); giveGear(idx);
        startMission(idx);
        const sp=SPAWN(idx);
        if(sp){ setTimeout(()=>{ const ent=(mode==='car')?car:ped; ent.obj.position.set(sp.x,0,sp.z); if(ent.heading!==undefined) ent.heading=sp.h; ent.obj.rotation.y=sp.h; ent.speed=0; },80); }
        showMissionBanner('Jumped to chapter '+ch+', mission '+ms,2.5);
      }catch(e){ console.warn('jump failed',e); }
    },60);
  }
  function run(txt){
    const t=txt.trim().toLowerCase();
    if(!t) return;
    const m=/^(\d+)\s*[:.\s]\s*(\d+)$/.exec(t);
    if(m) return jump(+m[1],+m[2]);
    if(t==='godmode'||t==='god'){ hide(true); setTimeout(()=>setGod(!god),60); return; }
    if(/^(help|\?)$/.test(t)) return say('godmode  |  chapter:mission -> 1:1..1:4  2:1..2:4  3:1..3:3');
    say('Unknown command. Use chapter:mission, e.g. 1:2',true);
  }
  // Tab opens/closes (capture phase so the game never sees it)
  window.addEventListener('keydown',e=>{
    if(e.code==='Tab'){ e.preventDefault(); e.stopPropagation(); open?hide(true):show(); }
  },true);
  // while typing, keep every key away from the game's controls
  inp.addEventListener('keydown',e=>{
    e.stopPropagation();
    if(e.code==='Enter'){ e.preventDefault(); run(inp.value); }
    else if(e.code==='Escape'){ e.preventDefault(); hide(true); }
  });
  inp.addEventListener('keyup',e=>e.stopPropagation());
})();
</script>
<script>
// ---- Reese's garage door (the garage itself is built into Rustfield's map; only this door moves) ----
(()=>{
  try{
    const XC=-368,Z0=142,GH=5.2,GW=13,DH=GH-0.9;
    const c=document.createElement('canvas');c.width=64;c.height=128;const g=c.getContext('2d');
    g.fillStyle='#b8bcc0';g.fillRect(0,0,64,128);g.strokeStyle='#7d8286';g.lineWidth=2;
    for(let y=8;y<128;y+=16){g.beginPath();g.moveTo(0,y);g.lineTo(64,y);g.stroke()}
    const t=new THREE.CanvasTexture(c);
    const d=new THREE.Mesh(new THREE.BoxGeometry(GW-0.6,DH,0.35),new THREE.MeshLambertMaterial({map:t}));
    d.userData.openY=DH+DH/2+0.2; d.userData.closedY=DH/2;
    d.position.set(XC,d.userData.openY,Z0+0.1); d.castShadow=true;

  }catch(e){console.warn('garage door skipped',e)}

</script>
<script>
// ---- sprint: hold Left Shift on foot ----
(()=>{
const _u=updatePed;
updatePed=function(dt){
 const G=window.GX25,sp=keys.ShiftLeft&&mode==='foot'&&!(G&&G.frozen&&G.frozen());
 if(!sp)return _u.apply(this,arguments);
 const m0=ped.maxSpeed,c0=ped.walkCycle;
 ped.maxSpeed=m0*1.65;
 try{_u.apply(this,arguments)}finally{ped.maxSpeed=m0}
 if(ped.speed>1){ped.walkCycle+=(ped.walkCycle-c0)*.6;const u=ped.obj.userData;u.legL.rotation.x*=1.5;u.legR.rotation.x*=1.5} // faster, longer stride while sprinting
};
})();
